<!DOCTYPE html>
<!-- Verunka — příprava na jednotnou přijímací zkoušku (CERMAT, čtyřleté obory)
     Copyright © 2026 Petr Poslušný. Všechna práva vyhrazena. -->
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>📐 Verunka — příprava na přijímačky 2027</title>
<style>
:root{--board:#1e3d33;--board2:#17302a;--wood:#7a5230;--wood2:#5c3d24;--chalk:#f4f1e8;--chalk-dim:#bcc9c2;
--gold:#ffd84d;--cyan:#7fe3ff;--pink:#ff8ad1;--green:#6ee7a0;--red:#ff8080;--bg:#0f1a17;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:radial-gradient(circle at 50% 0%,#1b2f28,#0b1411 70%);color:var(--chalk);
font-family:'Segoe UI',system-ui,-apple-system,sans-serif;min-height:100vh;padding:12px 8px 40px}
.wrap{max-width:980px;margin:0 auto}
@media (min-width:900px){.wrap{max-width:1120px}}
h1{font-size:23px;margin:6px 0 2px;letter-spacing:.3px}
.sub{font-size:13px;color:var(--chalk-dim);margin-bottom:16px}
.screen{display:none}.screen.on{display:block;animation:fade .25s}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
/* ===== TABULE ===== */
.board{background:linear-gradient(160deg,var(--board),var(--board2));border:11px solid var(--wood);
border-radius:10px;box-shadow:0 0 0 3px var(--wood2),0 14px 34px rgba(0,0,0,.55),inset 0 0 70px rgba(0,0,0,.35);
padding:26px 22px;position:relative;min-height:clamp(240px,46vh,460px)}
.board::after{content:"";position:absolute;left:0;right:0;bottom:-11px;height:11px;
background:linear-gradient(var(--wood),var(--wood2))}
.board .chalkline{position:absolute;right:16px;top:10px;font-size:19px;opacity:.5}
.bt{font-size:clamp(19px,2.4vw,24px);font-weight:700;color:var(--gold);margin-bottom:14px;
text-shadow:0 0 9px rgba(255,216,77,.3)}
.bx{font-size:clamp(16.5px,2vw,19px);line-height:1.72;white-space:pre-wrap;text-shadow:0 0 6px rgba(244,241,232,.16)}
.formula{font-size:clamp(21px,2.6vw,27px);font-weight:700;letter-spacing:.6px;color:var(--cyan);margin:14px 0 6px;
text-align:center;text-shadow:0 0 10px rgba(127,227,255,.35)}
.formula .fl{margin:10px 0;padding:11px 14px;background:rgba(0,0,0,.22);border-radius:10px;
box-shadow:inset 0 0 0 1px rgba(127,227,255,.16)}
.formula .fmez{height:14px}
.step .f .fl{margin:8px 0;padding:9px 12px;background:rgba(0,0,0,.20);border-radius:9px;text-align:left;
box-shadow:inset 0 0 0 1px rgba(127,227,255,.14)}
.step .f .fmez{height:12px}
/* ===== KROKY ===== */
.step{border-left:3px solid rgba(255,216,77,.5);padding:10px 0 10px 15px;margin:18px 0;animation:fade .3s}
.step .n{font-size:11px;color:var(--gold);letter-spacing:1.4px;font-weight:700;text-transform:uppercase}
.step .d{font-size:clamp(15.5px,1.9vw,18px);line-height:1.6;margin:5px 0 0}
.step .f{font-size:clamp(20px,2.4vw,25px);font-weight:700;color:var(--cyan);margin-top:9px;letter-spacing:.5px}
.result{margin-top:16px;padding:13px;border-radius:9px;background:rgba(110,231,160,.14);
border:1px solid rgba(110,231,160,.45);font-size:17px;font-weight:700;color:var(--green);text-align:center}
/* ===== TLAČÍTKA ===== */
button{font-family:inherit;cursor:pointer;border:none}
.btn{display:block;width:100%;background:linear-gradient(90deg,var(--gold),#ffb43f);color:#241b00;
font-weight:800;font-size:16px;padding:14px;border-radius:13px;margin-top:12px;
box-shadow:0 5px 16px rgba(255,216,77,.28)}
.btn:active{transform:translateY(1px)}
.btn.sec{background:transparent;color:var(--chalk);border:1.5px solid rgba(244,241,232,.35);box-shadow:none}
.btn.cy{background:linear-gradient(90deg,var(--cyan),#3fa9ff);color:#01243a;box-shadow:0 5px 16px rgba(127,227,255,.25)}
.btn:disabled{opacity:.4;cursor:default}
.row{display:flex;gap:10px}.row .btn{margin-top:12px}
/* ===== KARTY / VÝBĚR ===== */
.card{width:100%;text-align:left;background:rgba(255,255,255,.055);border:1px solid rgba(244,241,232,.16);
border-radius:14px;padding:14px 16px;margin-bottom:10px;color:var(--chalk);display:block}
.card:hover{background:rgba(255,255,255,.1)}
.card b{font-size:16px;display:block;margin-bottom:3px}
.card span{font-size:12.5px;color:var(--chalk-dim);line-height:1.45}
.card .bar{height:5px;border-radius:3px;background:rgba(255,255,255,.13);margin-top:9px;overflow:hidden}
.card .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--green),var(--cyan))}
.ans{width:100%;text-align:left;background:rgba(255,255,255,.06);border:1.5px solid rgba(244,241,232,.2);
border-radius:12px;padding:13px 15px;margin-bottom:9px;color:var(--chalk);font-size:15.5px;line-height:1.4}
.ans:hover{border-color:rgba(255,216,77,.6)}
.ans.ok{background:rgba(110,231,160,.2);border-color:var(--green)}
.ans.bad{background:rgba(255,128,128,.16);border-color:var(--red)}
.ans .k{display:inline-block;width:24px;font-weight:800;color:var(--gold)}
input[type=text]{width:100%;background:rgba(255,255,255,.08);border:1.5px solid rgba(244,241,232,.28);
border-radius:12px;padding:14px;color:var(--chalk);font-family:inherit;font-size:19px;font-weight:700;
text-align:center;letter-spacing:.5px}
input[type=text]:focus{outline:none;border-color:var(--gold)}
.hintline{font-size:12px;color:var(--chalk-dim);text-align:center;margin-top:7px}
/* ===== HLAVIČKA ÚLOHY ===== */
.qhead{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;
color:var(--chalk-dim);margin-bottom:10px}
.pill{background:rgba(255,255,255,.09);border-radius:20px;padding:4px 12px;font-weight:700}
.fb{padding:12px;border-radius:11px;margin-top:12px;font-size:15px;font-weight:700;text-align:center;animation:fade .3s}
.fb.ok{background:rgba(110,231,160,.16);color:var(--green);border:1px solid rgba(110,231,160,.4)}
.fb.no{background:rgba(255,216,77,.13);color:var(--gold);border:1px solid rgba(255,216,77,.4)}
.speed{width:100%;background:rgba(255,255,255,.05);border:1px dashed rgba(244,241,232,.28);border-radius:11px;
padding:9px;color:var(--chalk-dim);font-size:12.5px;font-weight:700;margin-bottom:12px}
.speed.on{background:rgba(127,227,255,.13);border:1px solid rgba(127,227,255,.55);color:var(--cyan)}
.tag{display:inline-block;font-size:11px;letter-spacing:1.2px;text-transform:uppercase;font-weight:800;
color:var(--pink);margin-bottom:7px}
svg.vis{display:block;width:100%;max-width:520px;height:auto;margin:16px auto}
.dots{display:flex;gap:5px;justify-content:center;margin-top:14px}
.dots i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.25)}
.dots i.on{background:var(--gold);width:20px;border-radius:4px}
.foot{text-align:center;font-size:11px;color:#5d6f68;margin-top:26px}
.stat{display:flex;gap:9px;margin-bottom:14px}
.stat div{flex:1;background:rgba(255,255,255,.06);border-radius:11px;padding:9px;text-align:center}
.stat b{display:block;font-size:19px;color:var(--gold)}
.stat span{font-size:11px;color:var(--chalk-dim)}
</style>
</head>
<body>
<div class="wrap">

<!-- ===== MENU ===== -->
<div class="screen on" id="s-menu">
  <h1>📐 Verunka — přijímačky 2027</h1>
  <div class="sub">Jednotná přijímací zkouška, čtyřleté obory · podle specifikace CERMAT</div>
  <div class="stat">
    <div><b id="stDone">0</b><span>vyřešených úloh</span></div>
    <div><b id="stOk">0 %</b><span>úspěšnost</span></div>
    <div><b id="stDays">–</b><span>dní do zkoušky</span></div>
  </div>
  <div id="okruhy"></div>
  <button class="btn sec" onclick="resetProgress()">Vynulovat postup</button>
  <div class="foot">© 2026 Petr Poslušný — všechna práva vyhrazena</div>
</div>

<!-- ===== VÝBĚR REŽIMU ===== -->
<div class="screen" id="s-rezim">
  <h1 id="rzName"></h1>
  <div class="sub" id="rzPopis"></div>
  <button class="card" onclick="startVyklad()">
    <b>🧑‍🏫 Nauč mě to</b>
    <span>Nejdřív si na tabuli projdeš výklad s příklady. Teprve pak přijdou úlohy. Vyber, když látku ještě moc neznáš.</span>
  </button>
  <button class="card" onclick="startUlohy()">
    <b>✏️ Chci to zkusit</b>
    <span>Jdeš rovnou na úlohy. Po odpovědi si můžeš nechat ukázat postup na tabuli — nebo rovnou pokračovat dál. Když látku umíš, zapni si u úloh ⏩ rychlý režim a poletíš.</span>
  </button>
  <button class="btn sec" onclick="go('menu')">← Zpět na okruhy</button>
</div>

<!-- ===== VÝKLAD ===== -->
<div class="screen" id="s-vyklad">
  <div class="qhead"><span id="vkOkruh"></span><span class="pill" id="vkPoc"></span></div>
  <div class="board">
    <div class="chalkline">🖍️</div>
    <div class="bt" id="vkH"></div>
    <div class="bx" id="vkT"></div>
    <div id="vkExtra"></div>
  </div>
  <div class="dots" id="vkDots"></div>
  <div class="row">
    <button class="btn sec" id="vkBack" onclick="vyklad(-1)">← Zpět</button>
    <button class="btn" id="vkNext" onclick="vyklad(1)">Další →</button>
  </div>
  <button class="btn sec" onclick="go('menu')">Zpět na okruhy</button>
</div>

<!-- ===== ÚLOHA ===== -->
<div class="screen" id="s-uloha">
  <div class="qhead"><span id="ulOkruh"></span><span class="pill" id="ulPoc"></span></div>
  <button class="speed" id="ulSpeed" onclick="toggleRychly()"></button>
  <div class="board">
    <div class="chalkline">📝</div>
    <div class="tag" id="ulTag">Úloha</div>
    <div class="bx" id="ulQ"></div>
    <div id="ulVis"></div>
  </div>
  <div id="ulAns" style="margin-top:14px"></div>
  <div id="ulFb"></div>
  <button class="btn cy" id="ulShow" style="display:none" onclick="showTabule()">🧑‍🏫 Ukaž postup na tabuli</button>
  <button class="btn" id="ulNext" style="display:none" onclick="dalsiUloha()">Pokračovat na další úlohu →</button>
  <button class="btn sec" onclick="go('menu')">Zpět na okruhy</button>
</div>

<!-- ===== TABULE S POSTUPEM ===== -->
<div class="screen" id="s-tabule">
  <div class="qhead"><span id="tbOkruh"></span><span class="pill" id="tbPoc"></span></div>
  <div class="board">
    <div class="chalkline">🧑‍🏫</div>
    <div class="bt">Postup krok za krokem</div>
    <div class="bx" id="tbQ" style="font-size:14.5px;color:var(--chalk-dim)"></div>
    <div id="tbSteps"></div>
    <div id="tbRes"></div>
  </div>
  <button class="btn" id="tbNext" onclick="krok()">Další krok →</button>
  <button class="btn cy" id="tbDone" style="display:none" onclick="dalsiUloha()">Další úloha →</button>
  <button class="btn sec" onclick="go('menu')">Zpět na okruhy</button>
</div>

</div>
<script>
/* ================= DATA ================= */
const ZKOUSKA=new Date("2027-04-13"); // orientační termín JPZ 2027

const DATA=[
{
 id:"mat-rovnice", predmet:"Matematika", ikona:"🟰",
 nazev:"Lineární rovnice",
 popis:"Ekvivalentní úpravy, závorky, zlomky, zkouška i slovní úlohy. Objevuje se skoro v každém testu.",
 vyklad:[
  {h:"Co je vlastně rovnice?",
   t:"Rovnice je tvrzení, že se dvě strany rovnají. Uprostřed je rovnítko a někde se schovává neznámá — obvykle x.\n\nTvůj úkol je jediný: dostat x samotné na jednu stranu. Všechno ostatní musí odejít na druhou.",
   f:"3x + 5 = 20   →   x = 5"},
  {h:"Rovnice jsou jako váhy",
   t:"Představ si rovnítko jako střed vah. Obě strany jsou v rovnováze.\n\nKdyž něco přidáš vlevo, musíš to samé přidat i vpravo — jinak se váhy překlopí. Přesně to znamená ekvivalentní úprava.",
   svg:'<svg class="vis" viewBox="0 0 320 130" xmlns="http://www.w3.org/2000/svg"><line x1="160" y1="20" x2="160" y2="95" stroke="#f4f1e8" stroke-width="3"/><line x1="55" y1="35" x2="265" y2="35" stroke="#f4f1e8" stroke-width="3"/><polygon points="160,95 135,120 185,120" fill="none" stroke="#f4f1e8" stroke-width="3"/><rect x="25" y="38" width="60" height="34" rx="5" fill="none" stroke="#7fe3ff" stroke-width="2.5"/><text x="55" y="61" fill="#7fe3ff" font-size="17" font-weight="700" text-anchor="middle" font-family="sans-serif">3x+5</text><rect x="235" y="38" width="60" height="34" rx="5" fill="none" stroke="#ffd84d" stroke-width="2.5"/><text x="265" y="61" fill="#ffd84d" font-size="17" font-weight="700" text-anchor="middle" font-family="sans-serif">20</text><text x="160" y="17" fill="#f4f1e8" font-size="15" text-anchor="middle" font-family="sans-serif">=</text></svg>'},
  {h:"Úprava 1 — přičítání a odčítání",
   t:"Chceš dostat x doleva a čísla doprava.\n\nPravidlo do kapsy: co přechází přes rovnítko, mění znaménko. Plus se změní na minus a naopak.",
   f:"3x + 5 = 20  | −5\n3x = 15"},
  {h:"Úprava 2 — násobení a dělení",
   t:"Když u x zůstane číslo, celou rovnici tím číslem vyděl. Zase obě strany!\n\nJediný zákaz: nikdy nesmíš dělit nulou.",
   f:"3x = 15  | :3\nx = 5"},
  {h:"Závorky roznásob jako první",
   t:"Máš-li v rovnici závorku, nejdřív ji odstraň. Číslo před závorkou vynásobíš každý člen uvnitř.\n\nPozor na minus před závorkou — to obrátí znaménka všech členů uvnitř.",
   f:"2(x + 3) = 2x + 6\n−(x − 4) = −x + 4"},
  {h:"Zlomky? Vynásob a zmizí",
   t:"Zlomky v rovnici jsou jen strašák. Najdi nejmenší společný jmenovatel a jím vynásob celou rovnici — každý člen na obou stranách.\n\nZlomky se zkrátí a zbude ti obyčejná rovnice.",
   f:"x/2 + x/3 = 5  | ·6\n3x + 2x = 30"},
  {h:"Zkouška — a máš jistotu",
   t:"Zkouška není otrava, je to tvoje pojistka. Za body v testu se často počítá i ona.\n\nDůležité: dosazuj vždy do PŮVODNÍ rovnice, ne do té upravené. Kdybys totiž udělala chybu při úpravě, zkouška by ti ji neodhalila.",
   f:"L = 3·5 + 5 = 20\nP = 20\nL = P  ✓"},
  {h:"Dva zvláštní případy",
   t:"Občas se x vykrátí úplně. Nezpanikař, jsou jen dvě možnosti:\n\n• Zbude pravdivé tvrzení (třeba 0 = 0) → rovnice má nekonečně mnoho řešení.\n• Zbude nesmysl (třeba 0 = 5) → rovnice nemá žádné řešení.",
   f:"2x + 2 = 2x + 2  →  0 = 0\n3x + 2 = 3x + 7  →  0 = 5"}
 ],
 ulohy:[
  {q:"Řeš rovnici:\n\n4x + 7 = 31", typ:"open", odp:"6",
   kroky:[
    {n:"Krok 1 — dostaň čísla doprava", d:"Od obou stran odečti 7. Sedmička přejde přes rovnítko a změní znaménko.", f:"4x = 31 − 7\n4x = 24"},
    {n:"Krok 2 — osamostatni x", d:"U x stojí čtyřka, takže obě strany vyděl čtyřmi.", f:"x = 24 : 4\nx = 6"},
    {n:"Krok 3 — zkouška", d:"Dosaď 6 do původní rovnice a spočítej obě strany zvlášť.", f:"L = 4·6 + 7 = 31\nP = 31   →   L = P ✓"}
   ], vys:"x = 6"},

  {q:"Řeš rovnici:\n\n5x − 7 = 2x + 8", typ:"open", odp:"5",
   kroky:[
    {n:"Krok 1 — x doleva", d:"Neznámá je na obou stranách. Odečti 2x od obou stran, aby zůstala jen vlevo.", f:"5x − 2x − 7 = 8\n3x − 7 = 8"},
    {n:"Krok 2 — čísla doprava", d:"Přičti 7 k oběma stranám.", f:"3x = 8 + 7\n3x = 15"},
    {n:"Krok 3 — vyděl", d:"Obě strany vyděl třemi.", f:"x = 5"},
    {n:"Krok 4 — zkouška", d:"Dosaď do původní rovnice.", f:"L = 5·5 − 7 = 18\nP = 2·5 + 8 = 18  ✓"}
   ], vys:"x = 5"},

  {q:"Řeš rovnici se závorkou:\n\n2(x + 3) = 14", typ:"open", odp:"4",
   kroky:[
    {n:"Krok 1 — roznásob závorku", d:"Dvojku vynásob s každým členem uvnitř závorky.", f:"2·x + 2·3 = 14\n2x + 6 = 14"},
    {n:"Krok 2 — odečti 6", d:"Šestka přejde doprava se změněným znaménkem.", f:"2x = 8"},
    {n:"Krok 3 — vyděl dvěma", d:"", f:"x = 4"},
    {n:"Zkouška", d:"Dosaď zpátky do původního tvaru se závorkou.", f:"L = 2·(4 + 3) = 2·7 = 14  ✓"}
   ], vys:"x = 4"},

  {q:"Pozor na minus před závorkou:\n\n5x − (2x − 6) = 12", typ:"open", odp:"2",
   kroky:[
    {n:"Krok 1 — odstraň závorku", d:"Před závorkou je minus, takže se obrátí znaménka VŠECH členů uvnitř. Tady dělá většina lidí chybu.", f:"5x − 2x + 6 = 12"},
    {n:"Krok 2 — sečti x", d:"5x mínus 2x jsou 3x.", f:"3x + 6 = 12"},
    {n:"Krok 3 — dopočítej", d:"Odečti 6 a vyděl třemi.", f:"3x = 6\nx = 2"},
    {n:"Zkouška", d:"", f:"L = 5·2 − (2·2 − 6) = 10 − (−2) = 12  ✓"}
   ], vys:"x = 2"},

  {q:"Řeš rovnici:\n\n4(x − 1) = 3(x + 2)", typ:"open", odp:"10",
   kroky:[
    {n:"Krok 1 — roznásob obě závorky", d:"Vlevo čtyřkou, vpravo trojkou.", f:"4x − 4 = 3x + 6"},
    {n:"Krok 2 — x doleva, čísla doprava", d:"Odečti 3x a přičti 4.", f:"4x − 3x = 6 + 4\nx = 10"},
    {n:"Zkouška", d:"Dosaď do původní rovnice.", f:"L = 4·(10 − 1) = 36\nP = 3·(10 + 2) = 36  ✓"}
   ], vys:"x = 10"},

  {q:"Rovnice se zlomkem:\n\nx/3 + 2 = 5", typ:"open", odp:"9",
   kroky:[
    {n:"Krok 1 — zbav se čísla", d:"Nejdřív odečti 2 od obou stran.", f:"x/3 = 3"},
    {n:"Krok 2 — vynásob jmenovatelem", d:"Obě strany vynásob třemi, zlomek zmizí.", f:"x = 9"},
    {n:"Zkouška", d:"", f:"L = 9:3 + 2 = 5  ✓"}
   ], vys:"x = 9"},

  {q:"Řeš rovnici:\n\nx/2 + x/3 = 5", typ:"open", odp:"6",
   kroky:[
    {n:"Krok 1 — najdi společný jmenovatel", d:"Jmenovatelé jsou 2 a 3. Nejmenší společný násobek je 6.", f:"NSN(2, 3) = 6"},
    {n:"Krok 2 — vynásob celou rovnici šesti", d:"Každý člen na obou stranách! Zlomky se zkrátí.", f:"6·x/2 + 6·x/3 = 6·5\n3x + 2x = 30"},
    {n:"Krok 3 — dopočítej", d:"Sečti x a vyděl.", f:"5x = 30\nx = 6"},
    {n:"Zkouška", d:"", f:"L = 6:2 + 6:3 = 3 + 2 = 5  ✓"}
   ], vys:"x = 6"},

  {q:"Náročnější zlomky (typ z ostrého testu):\n\n(x − 6)/6 = (2x − 3)/2 − (3x − 2)/3", typ:"open", odp:"1",
   kroky:[
    {n:"Krok 1 — společný jmenovatel", d:"Jmenovatelé jsou 6, 2 a 3. Nejmenší společný násobek je 6.", f:"NSN(6, 2, 3) = 6"},
    {n:"Krok 2 — vynásob šesti", d:"Každý zlomek vynásob šesti a zkrať. Čitatele dej do závorek, ať neuděláš chybu se znaménky.", f:"(x − 6) = 3(2x − 3) − 2(3x − 2)"},
    {n:"Krok 3 — roznásob závorky", d:"Pozor na minus před druhou závorkou.", f:"x − 6 = 6x − 9 − 6x + 4"},

{
 id:"cj-shoda", predmet:"Čeština", ikona:"✍️",
 nazev:"Shoda přísudku s podmětem",
 popis:"Kdy psát v příčestí -i, -y nebo -a. Nejčastější pravopisný jev v testu — a jeden z nejzrádnějších.",
 vyklad:[
  {h:"O co vlastně jde?",
   t:"V minulém čase se sloveso musí přizpůsobit podmětu. Tomu se říká shoda přísudku s podmětem.\n\nRozhoduje se poslední písmeno slovesa — a to podle toho, jakého rodu a čísla je podmět.",
   f:"Chlapci běželi.\nDívky běžely.\nKuřata běžela."},
  {h:"Vždycky postupuj v těchto třech krocích",
   t:"Nikdy nehádej podle citu. Vždycky si projdi tyhle tři otázky — nikdy tě nezradí:\n\n1. Najdi podmět. Zeptej se: KDO nebo CO to dělal?\n2. Urči jeho rod a číslo.\n3. Podle tabulky doplň koncovku.",
   f:"KDO? → jaký rod? → koncovka"},
  {h:"Množné číslo — hlavní tabulka",
   t:"Tuhle tabulku si zapamatuj a máš vyhráno. Platí pro množné číslo:\n\n• rod mužský ŽIVOTNÝ → -i\n• rod mužský NEŽIVOTNÝ → -y\n• rod ŽENSKÝ → -y\n• rod STŘEDNÍ → -a",
   f:"muži nesli    (M životný)\nstromy padaly (M neživotný)\nženy nesly    (ženský)\nauta jela     (střední)"},
  {h:"Jednotné číslo je jednodušší",
   t:"V jednotném čísle se koncovka řídí rodem takto:\n\n• rod mužský → -l  (chlapec běžel)\n• rod ženský → -la (dívka běžela)\n• rod střední → -lo (kotě běželo)\n\nTady chybu skoro nikdo neudělá, sluch si poradí sám.",
   f:"pes štěkal · fena štěkala · štěně štěkalo"},
  {h:"Zrádná slova, na kterých se propadá",
   t:"Některá podstatná jména vypadají jako ženský rod, ale jsou mužská životná — nebo naopak. Ta si zapamatuj zvlášť:\n\n• koně, lidé, hosté, rodiče → mužský ŽIVOTNÝ → -i\n• děti, oči, uši → rod ŽENSKÝ → -y\n• housata, koťata, děvčata → rod STŘEDNÍ → -a",
   f:"Koně běželi.   ale   Děti běhaly.\nLidé přišli.   ale   Oči se leskly."},
  {h:"Několikanásobný podmět",
   t:"Když je podmětů víc, platí jednoduché pravidlo: stačí jediný mužský životný a celý přísudek dostane -i.\n\nJe úplně jedno, kolik je tam ženských nebo středních — ten jeden mužský životný rozhodne.",
   f:"Maminka, sestra a bratr odjeli.\n(bratr = M životný → -i)\n\nSestra a maminka odjely.\n(oba ženské → -y)"},
  {h:"Podmět nevyjádřený",
   t:"Někdy podmět ve větě vůbec není napsaný. Pak ho musíš najít z předchozí věty nebo z tvaru slovesa.\n\nNejjistější je dosadit si zájmeno oni / ony / ona a podívat se, koho zastupuje.",
   f:"Kluci šli do lesa. Nesli si batohy.\n(kdo nesl? → kluci → -i)"},
  {h:"Pozor na past: podmět není to nejbližší slovo",
   t:"Tvůrci testů schválně dají těsně před sloveso slovo jiného rodu, aby tě zmátli. Podmět ale může být daleko vepředu.\n\nProto se vždycky ptej KDO / CO, ne co je nejblíž slovesu.",
   f:"Chlapci u řeky s udicemi seděli.\n(kdo seděl? chlapci → -i, ne udice!)"}
 ],

  {q:"Doplň správnou koncovku:\n\nDivadelní představení diváky nadchl__.", typ:"choice",

    {n:"Krok 2 — urči rod a číslo", d:"Představení je rod STŘEDNÍ a tady jednotné číslo — jedno představení.", f:"rod STŘEDNÍ, jednotné číslo"},
    {n:"Krok 3 — doplň koncovku", d:"Střední rod v jednotném čísle → -lo.", f:"→ nadchlo"}

 ]
},
{
 id:"mat-vyrazy", predmet:"Matematika", ikona:"🔤",
 nazev:"Výrazy a mnohočleny",
 popis:"Roznásobování, vytýkání a tři vzorce, které musíš znát zpaměti. Bez toho se neobejdeš u rovnic ani u slovních úloh.",
 vyklad:[
  {h:"Co je výraz a co proměnná",t:"Výraz je zápis složený z čísel, písmen a znamének. Písmenu se říká proměnná — může za ni přijít jakékoli číslo.\n\nČlen výrazu je každá část oddělená plusem nebo mínusem. Ve výrazu 3x + 5y − 2 jsou tři členy.",f:"3x + 5y − 2\n↑     ↑     ↑\n1.    2.    3. člen"},
  {h:"Sčítat smíš jen stejné členy",t:"Stejné členy mají úplně stejné písmeno i mocninu. Jen ty se dají sečíst.\n\n3x a 5x sečteš na 8x. Ale 3x a 5x² sečíst nejde — to jsou různé věci a musí zůstat vedle sebe.",f:"3x + 5x = 8x  ✓\n3x + 5x² = 3x + 5x²  (nejde zjednodušit)"},
  {h:"Roznásobování závorky",t:"Číslo před závorkou vynásobíš s každým členem uvnitř. Na žádný nesmíš zapomenout.\n\nJe-li před závorkou mínus, obrátí znaménka všech členů uvnitř. Tady se chybuje nejvíc.",f:"3(2x − 4) = 6x − 12\n−(2x − 4) = −2x + 4"},
  {h:"Závorka krát závorka",t:"Každý člen první závorky vynásobíš s každým členem druhé. U dvoučlenů to jsou čtyři součiny.\n\nPomůcka: postupuj vždy stejně — první s prvním, první s druhým, druhý s prvním, druhý s druhým.",f:"(x + 2)(x + 3) =\n= x² + 3x + 2x + 6 =\n= x² + 5x + 6"},
  {h:"Tři vzorce, které musíš umět nazpaměť",t:"Tyhle tři se v testu objevují pořád. Naučit se je vyplatí víc než cokoli jiného v tomhle okruhu.\n\nTřetí z nich — rozdíl druhých mocnin — se hodí i obráceně, k rozkladu na součin.",f:"(a + b)² = a² + 2ab + b²\n(a − b)² = a² − 2ab + b²\n(a + b)(a − b) = a² − b²"},
  {h:"Vytýkání — vzorce naruby",t:"Vytýkání je opak roznásobování. Najdeš, co mají všechny členy společné, a dáš to před závorku.\n\nZkouška je snadná: roznásob to zpátky a musíš dostat původní výraz.",f:"6x + 9 = 3(2x + 3)\n4x² − 8x = 4x(x − 2)"},
  {h:"Hodnota výrazu",t:"Dosadit číslo za proměnnou umí každý. Pozor jen na dvě věci:\n\nZáporné číslo dosazuj vždy do závorky. A nezapomeň na pořadí operací — nejdřív mocniny, pak násobení, až nakonec sčítání.",f:"pro x = −2:\n3x² = 3·(−2)² = 3·4 = 12\n(ne 3·(−4) = −12!)"}
 ],
 ulohy:[
  {q:"Zjednoduš výraz:\n\n5x + 3y − 2x + 7y",typ:"open",odp:"3x+10y",
   kroky:[{n:"Krok 1 — najdi stejné členy",d:"Členy s x jsou 5x a −2x. Členy s y jsou 3y a 7y.",f:"(5x − 2x) + (3y + 7y)"},
    {n:"Krok 2 — sečti každou skupinu zvlášť",d:"",f:"3x + 10y"},
    {n:"Krok 3 — dál to nejde",d:"3x a 10y sečíst nelze, mají různé proměnné. Výsledek necháváme takto.",f:"3x + 10y"}],
   vys:"3x + 10y"},
  {q:"Roznásob a zjednoduš:\n\n2(x − 3) − 4(2 − x)",typ:"open",odp:"6x-14",
   kroky:[{n:"Krok 1 — roznásob první závorku",d:"Dvojkou vynásob oba členy.",f:"2x − 6"},
    {n:"Krok 2 — roznásob druhou závorku",d:"Před závorkou je −4. Vynásob −4 s oběma členy: −4·2 = −8 a −4·(−x) = +4x.",f:"−8 + 4x"},
    {n:"Krok 3 — sečti stejné členy",d:"2x a 4x dají 6x, −6 a −8 dají −14.",f:"6x − 14"}],
   vys:"6x − 14"},
  {q:"Umocni podle vzorce:\n\n(x + 5)²",typ:"open",odp:"x²+10x+25",
   kroky:[{n:"Krok 1 — vyber správný vzorec",d:"Je to druhá mocnina součtu, tedy (a + b)² = a² + 2ab + b².",f:"a = x, b = 5"},
    {n:"Krok 2 — dosaď do vzorce",d:"a² je x², dvojnásobný součin je 2·x·5, b² je 25.",f:"x² + 2·x·5 + 5²"},
    {n:"Krok 3 — dopočítej",d:"Pozor: nejčastější chyba je napsat jen x² + 25 a zapomenout prostřední člen.",f:"x² + 10x + 25"}],
   vys:"x² + 10x + 25"},
  {q:"Umocni podle vzorce:\n\n(3a − 2)²",typ:"open",odp:"9a²-12a+4",
   kroky:[{n:"Krok 1 — urči a a b",d:"Je to druhá mocnina rozdílu. Za a dosazujeme celé 3a, ne jen a.",f:"a = 3a, b = 2"},
    {n:"Krok 2 — dosaď",d:"(3a)² = 9a². Prostřední člen je 2·3a·2 = 12a a je záporný. Poslední je 2² = 4.",f:"9a² − 12a + 4"},
    {n:"Poznámka",d:"Umocňuje se celý člen 3a včetně trojky. Napsat 3a² by byla chyba.",f:"(3a)² = 9a²  ✓"}],
   vys:"9a² − 12a + 4"},
  {q:"Roznásob:\n\n(x − 4)(x + 4)",typ:"open",odp:"x²-16",
   kroky:[{n:"Krok 1 — poznej vzorec",d:"Stejná dvojice se jednou sčítá a jednou odčítá. To je rozdíl druhých mocnin.",f:"(a + b)(a − b) = a² − b²"},
    {n:"Krok 2 — dosaď",d:"a je x, b je 4.",f:"x² − 4² = x² − 16"},
    {n:"Kontrola roznásobením",d:"x·x + 4x − 4x − 16. Prostřední členy se vyruší, zbude x² − 16.",f:"x² − 16  ✓"}],
   vys:"x² − 16"},
  {q:"Roznásob a zjednoduš:\n\n(2x + 1)(x − 3)",typ:"open",odp:"2x²-5x-3",
   kroky:[{n:"Krok 1 — každý s každým",d:"2x·x = 2x², 2x·(−3) = −6x, 1·x = x, 1·(−3) = −3.",f:"2x² − 6x + x − 3"},
    {n:"Krok 2 — sečti prostřední členy",d:"−6x a +x dají −5x.",f:"2x² − 5x − 3"}],
   vys:"2x² − 5x − 3"},
  {q:"Vytkni před závorku:\n\n12x + 18",typ:"open",odp:"6(2x+3)",
   kroky:[{n:"Krok 1 — najdi společného dělitele",d:"Čísla 12 a 18 dělí beze zbytku 6. To je největší společný dělitel.",f:"NSD(12, 18) = 6"},
    {n:"Krok 2 — vytkni",d:"Před závorku dej 6, dovnitř to, co zbude po dělení: 12x:6 = 2x a 18:6 = 3.",f:"6(2x + 3)"},
    {n:"Zkouška",d:"Roznásob zpátky: 6·2x = 12x, 6·3 = 18. Sedí.",f:"6(2x + 3) = 12x + 18  ✓"}],
   vys:"6(2x + 3)"},
  {q:"Vytkni před závorku:\n\n5a² − 15a",typ:"open",odp:"5a(a-3)",
   kroky:[{n:"Krok 1 — společné je i písmeno",d:"Čísla 5 a 15 dělí pětka. Navíc oba členy obsahují a — první dokonce a².",f:"společné: 5a"},
    {n:"Krok 2 — vytkni 5a",d:"5a²:5a = a a −15a:5a = −3.",f:"5a(a − 3)"},
    {n:"Zkouška",d:"5a·a = 5a², 5a·(−3) = −15a. Sedí.",f:"5a(a − 3)  ✓"}],
   vys:"5a(a − 3)"},
  {q:"Rozlož na součin pomocí vzorce:\n\nx² − 49",typ:"open",odp:"(x-7)(x+7)",
   kroky:[{n:"Krok 1 — poznej rozdíl druhých mocnin",d:"x² je druhá mocnina x, 49 je druhá mocnina sedmi. Mezi nimi je mínus.",f:"x² − 7²"},
    {n:"Krok 2 — použij vzorec pozpátku",d:"a² − b² = (a + b)(a − b).",f:"(x + 7)(x − 7)"},
    {n:"Poznámka",d:"Na pořadí závorek nezáleží, součin je stejný.",f:"(x − 7)(x + 7)  ✓"}],
   vys:"(x + 7)(x − 7)"},
  {q:"Vypočti hodnotu výrazu 2x² − 3x pro x = −2.",typ:"open",odp:"14",
   kroky:[{n:"Krok 1 — dosaď do závorky",d:"Záporné číslo dávej vždy do závorky, jinak se spleteš ve znaménku.",f:"2·(−2)² − 3·(−2)"},
    {n:"Krok 2 — nejdřív mocnina",d:"(−2)² je +4, protože mínus krát mínus je plus.",f:"2·4 − 3·(−2)"},
    {n:"Krok 3 — pak násobení a odčítání",d:"2·4 = 8 a −3·(−2) = +6.",f:"8 + 6 = 14"}],
   vys:"14"},
  {q:"Který zápis vyjadřuje obvod obdélníku se stranami x a x + 3?",typ:"choice",
   moz:["4x + 6","2x + 3","x² + 3x","2x + 6"],spr:0,
   kroky:[{n:"Krok 1 — vzorec pro obvod",d:"Obvod obdélníku je dvojnásobek součtu obou stran.",f:"o = 2·(a + b)"},
    {n:"Krok 2 — dosaď strany",d:"",f:"o = 2·(x + x + 3)"},
    {n:"Krok 3 — zjednoduš uvnitř a roznásob",d:"Uvnitř je 2x + 3, dvojka to roznásobí.",f:"o = 2·(2x + 3) = 4x + 6"}],
   vys:"4x + 6"},
  {q:"Zapiš výrazem: číslo x zmenšené o třetinu čísla y.",typ:"choice",
   moz:["x − y/3","x/3 − y","(x − y)/3","3x − y"],spr:0,
   kroky:[{n:"Krok 1 — rozeber větu po částech",d:"Základ je číslo x. Od něj se něco odčítá.",f:"x − …"},
    {n:"Krok 2 — co se odčítá",d:"Třetina čísla y znamená y děleno třemi, tedy y/3.",f:"x − y/3"},
    {n:"Pozor na past",d:"Zápis (x − y)/3 by znamenal třetinu celého rozdílu. To je něco jiného.",f:"x − y/3  ✓"}],
   vys:"x − y/3"}
 ]
},
{
 id:"mat-mocniny", predmet:"Matematika", ikona:"²",
 nazev:"Mocniny a odmocniny",
 popis:"Druhé mocniny do patnácti zpaměti, počítání s mocninami desíti a odmocňování. Bez kalkulačky.",
 vyklad:[
  {h:"Co je mocnina",t:"Mocnina je zkrácený zápis opakovaného násobení. Číslo dole se jmenuje základ, číslo nahoře exponent.\n\n5³ znamená 5·5·5, tedy 125. Rozhodně to neznamená 5·3.",f:"5³ = 5·5·5 = 125\n(ne 15!)"},
  {h:"Druhé mocniny do patnácti — nauč se je",t:"Tyhle hodnoty musíš znát zpaměti, v testu na ně nemáš kalkulačku a šetří spoustu času.\n\n1, 4, 9, 16, 25, 36, 49, 64, 81, 100, 121, 144, 169, 196, 225",f:"11² = 121   12² = 144\n13² = 169   14² = 196   15² = 225"},
  {h:"Odmocnina je opačný pohyb",t:"Druhá odmocnina hledá číslo, které po umocnění na druhou dá ten výsledek.\n\nKdyž znáš mocniny do patnácti nazpaměť, umíš i odmocniny — jen se díváš na tabulku obráceně.",f:"√144 = 12,  protože 12² = 144\n√81 = 9,  protože 9² = 81"},
  {h:"Mocniny desíti a posouvání čárky",t:"Mocnina desíti říká, o kolik míst se posune desetinná čárka. Kladný exponent doprava, záporný doleva.\n\nTohle využiješ u převodů jednotek i u velkých čísel.",f:"10² = 100      10³ = 1 000\n10⁻¹ = 0,1     10⁻² = 0,01"},
  {h:"Součin a podíl pod odmocninou",t:"Odmocnit součin můžeš po částech — odmocníš každého činitele zvlášť. Totéž platí pro podíl.\n\nPozor: u součtu to NEPLATÍ. √(9 + 16) není 3 + 4, ale √25 = 5.",f:"√(4·25) = √4·√25 = 2·5 = 10\n√(9/16) = 3/4"},
  {h:"Geometrický význam druhé mocniny",t:"Druhá mocnina je obsah čtverce o dané straně. Odmocnina naopak najde stranu ze známého obsahu.\n\nProto se jí říká druhá — souvisí s plochou, tedy se dvěma rozměry.",f:"strana 7 cm → obsah 49 cm²\nobsah 64 cm² → strana 8 cm"}
 ],
 ulohy:[
  {q:"Vypočti zpaměti:\n\n13²",typ:"open",odp:"169",
   kroky:[{n:"Krok 1 — rozepiš",d:"Třináct na druhou znamená 13 krát 13.",f:"13·13"},
    {n:"Krok 2 — spočítej po částech",d:"13·13 = 13·10 + 13·3 = 130 + 39.",f:"130 + 39 = 169"},
    {n:"Zapamatuj si",d:"Tuhle hodnotu i sousední (12² = 144, 14² = 196) je dobré znát nazpaměť.",f:"13² = 169"}],
   vys:"169"},
  {q:"Vypočti:\n\n√196",typ:"open",odp:"14",
   kroky:[{n:"Krok 1 — hledej číslo, jehož druhá mocnina je 196",d:"Zkus mezi 13 a 15. 13² = 169, to je málo. 15² = 225, to je moc.",f:"13² = 169 < 196 < 225 = 15²"},
    {n:"Krok 2 — zbývá čtrnáctka",d:"14·14 = 196.",f:"√196 = 14"}],
   vys:"14"},
  {q:"Vypočti:\n\n√(0,49)",typ:"open",odp:"0.7",
   kroky:[{n:"Krok 1 — převeď na zlomek",d:"0,49 je 49 setin.",f:"√(49/100)"},
    {n:"Krok 2 — odmocni čitatele i jmenovatele",d:"√49 = 7 a √100 = 10.",f:"7/10"},
    {n:"Krok 3 — zpátky na desetinné číslo",d:"",f:"0,7"}],
   vys:"0,7"},
  {q:"Vypočti hodnotu výrazu:\n\n3² + 4²",typ:"open",odp:"25",
   kroky:[{n:"Krok 1 — nejdřív mocniny",d:"Mocniny mají přednost před sčítáním.",f:"9 + 16"},
    {n:"Krok 2 — sečti",d:"",f:"25"},
    {n:"Pozor na past",d:"Není to (3 + 4)² = 49. Mocnina se počítá zvlášť pro každé číslo.",f:"3² + 4² = 25 ≠ 49"}],
   vys:"25"},
  {q:"Vypočti:\n\n√(9·16)",typ:"open",odp:"12",
   kroky:[{n:"Krok 1 — dvě cesty, obě správné",d:"Buď nejdřív vynásob 9·16 = 144 a pak odmocni. Nebo odmocni každé zvlášť.",f:"√144  nebo  √9·√16"},
    {n:"Krok 2 — kratší cesta",d:"√9 = 3 a √16 = 4.",f:"3·4 = 12"}],
   vys:"12"},
  {q:"Kolik je jedna šestnáctina z jednoho metru čtverečního? (v cm²)",typ:"choice",
   moz:["625 cm²","6,25 cm²","16 cm²","1 600 cm²"],spr:0,

    {n:"Krok 2 — vyděl šestnácti",d:"",f:"10 000 : 16 = 625"},
    {n:"Poznámka",d:"Pozor, plošné jednotky se převádějí stovkou, ne desítkou. Tady se chybuje.",f:"625 cm²"}],
   vys:"625 cm²"},
  {q:"Zapiš pomocí mocniny desíti:\n\n0,001",typ:"choice",

   kroky:[{n:"Krok 1 — spočítej desetinná místa",d:"Jednička je na třetím místě za desetinnou čárkou.",f:"0,001 = 1/1000"},
    {n:"Krok 2 — převeď na mocninu",d:"Tisíc je 10³, takže jedna tisícina je 10 na mínus třetí.",f:"10⁻³"}],
   vys:"10⁻³"},
  {q:"Čtverec má obsah 121 cm². Jak dlouhá je jeho strana? (v cm)",typ:"open",odp:"11",
   kroky:[{n:"Krok 1 — vzorec pro obsah čtverce",d:"Obsah je strana krát strana, tedy druhá mocnina strany.",f:"S = a²"},
    {n:"Krok 2 — odmocni",d:"Hledáme číslo, jehož druhá mocnina je 121.",f:"a = √121 = 11"},
    {n:"Zkouška",d:"11·11 = 121. Sedí.",f:"strana = 11 cm"}],
   vys:"11 cm"},
  {q:"Vypočti:\n\n(−3)²",typ:"open",odp:"9",
   kroky:[{n:"Krok 1 — rozepiš",d:"Umocňuje se celé číslo v závorce, tedy −3.",f:"(−3)·(−3)"},
    {n:"Krok 2 — znaménka",d:"Mínus krát mínus je plus.",f:"+9"},
    {n:"Pozor na rozdíl",d:"Bez závorky je to jinak: −3² znamená −(3²) = −9. Závorka rozhoduje.",f:"(−3)² = 9   ale   −3² = −9"}],
   vys:"9"},
  {q:"Vypočti hodnotu výrazu:\n\n√64 + √36",typ:"open",odp:"14",
   kroky:[{n:"Krok 1 — odmocni každé zvlášť",d:"√64 = 8, protože 8² = 64. √36 = 6, protože 6² = 36.",f:"8 + 6"},
    {n:"Krok 2 — sečti",d:"",f:"14"},
    {n:"Pozor",d:"Není to √(64 + 36) = √100 = 10. Odmocnina se nedá rozdělit přes součet.",f:"√64 + √36 = 14"}],
   vys:"14"}
 ]
},
{
 id:"mat-pomer", predmet:"Matematika", ikona:"⚖️",
 nazev:"Poměr, úměrnost a měřítko",
 popis:"Trojčlenka, dělení v poměru, měřítko mapy a plánu. Základ skoro každé slovní úlohy.",
 vyklad:[
  {h:"Co je poměr",t:"Poměr porovnává dvě veličiny. Zapisuje se dvojtečkou a čte se „ku“.\n\nPoměr se dá krátit i rozšiřovat jako zlomek — 6 : 9 je totéž co 2 : 3.",f:"6 : 9 = 2 : 3\n(vydělíme obě čísla třemi)"},
  {h:"Dělení v daném poměru",t:"Musíš rozdělit celek v poměru? Spočítej nejdřív, kolik je dohromady dílů. Pak zjisti hodnotu jednoho dílu a tou násob.\n\nTenhle postup funguje vždycky, i pro tři a víc částí.",f:"1 200 Kč v poměru 2 : 3\ndílů: 2 + 3 = 5\njeden díl: 1 200 : 5 = 240\n480 Kč a 720 Kč"},
  {h:"Přímá úměrnost",t:"Když jedna veličina roste, druhá roste stejně rychle. Dvakrát víc rohlíků stojí dvakrát tolik.\n\nPoznávací znamení: podíl obou veličin je pořád stejný. Grafem je přímka procházející počátkem.",f:"3 rohlíky … 12 Kč\n6 rohlíků … 24 Kč\n12/3 = 24/6 = 4"},
  {h:"Nepřímá úměrnost",t:"Když jedna veličina roste, druhá klesá. Dvakrát víc dělníků udělá práci za poloviční čas.\n\nPoznávací znamení: součin obou veličin je pořád stejný. Grafem je hyperbola.",f:"3 dělníci … 8 dní\n6 dělníků … 4 dny\n3·8 = 6·4 = 24"},
  {h:"Trojčlenka — a hlavně šipky",t:"Napiš si zadání do dvou řádků pod sebe a udělej šipky.\n\nU přímé úměrnosti míří obě šipky stejným směrem. U nepřímé opačným — a to znamená, že jednu stranu zlomku otočíš.",f:"přímá:   ↓↓  nebo  ↑↑\nnepřímá: ↓↑  nebo  ↑↓"},
  {h:"Měřítko mapy a plánu",t:"Měřítko 1 : 50 000 znamená, že 1 cm na mapě je 50 000 cm ve skutečnosti.\n\nNejčastější chyba je zapomenout převést jednotky. Vždycky nakonec převeď centimetry na metry nebo kilometry.",f:"1 : 50 000\n1 cm → 50 000 cm = 500 m = 0,5 km"},
  {h:"Postup u měřítka",t:"Z mapy do skutečnosti se násobí, ze skutečnosti na mapu se dělí. Vždycky číslem z měřítka.\n\nJe-li měřítko zvětšovací (třeba 2 : 1 u drobné součástky), platí to obráceně.",f:"mapa → skutečnost: ·50 000\nskutečnost → mapa: :50 000"}
 ],

  {q:"SLOVNÍ ÚLOHA\n\nBabička rozdělila mezi vnoučata 1 500 Kč v poměru 2 : 3. Kolik korun dostalo to, které bralo víc?",typ:"open",odp:"900",

   kroky:[{n:"Krok 1 — urči typ úměrnosti",d:"Víc zedníků znamená míň dní. Veličiny jdou proti sobě — nepřímá úměrnost.",f:"nepřímá úměrnost"},
    {n:"Krok 2 — spočítej celkovou práci",d:"U nepřímé úměrnosti je součin stálý. Práce je 6·10 = 60 „člověkodnů“.",f:"6 · 10 = 60"},

  {q:"Na mapě s měřítkem 1 : 25 000 je vzdálenost 8 cm. Kolik je to ve skutečnosti v kilometrech?",typ:"open",odp:"2",

{
 id:"mat-procenta", predmet:"Matematika", ikona:"％",
 nazev:"Procenta a finanční matematika",
 popis:"Základ, počet procent, procentová část. Slevy, zdražení, úroky a daň z úroku — přesně jak to chce test.",
 vyklad:[
  {h:"Tři pojmy, které stačí rozlišit",t:"Základ je celek, tedy sto procent. Počet procent říká, kolik z něj bereme. Procentová část je výsledné množství.\n\nV každé úloze si nejdřív pojmenuj, co je co. Tím je půlka práce hotová.",f:"z 800 Kč (základ)\nvezmi 25 % (počet procent)\ndostaneš 200 Kč (část)"},
  {h:"Jedno procento je klíč",t:"Nejjistější postup: spočítej si jedno procento a pak jím násob.\n\nJedno procento získáš vydělením základu stem. Pak už jen násobíš, kolik procent potřebuješ.",f:"1 % z 800 = 800 : 100 = 8\n25 % = 25 · 8 = 200"},
  {h:"Sleva — pozor na dvě cesty",t:"Sleva 20 % se dá spočítat dvěma způsoby. Druhý je rychlejší a méně chybový.\n\nBuď spočítáš slevu a odečteš ji. Nebo rovnou spočítáš, kolik zbude — tedy 80 %.",f:"cena 500, sleva 20 %\ncesta A: 500 − 100 = 400\ncesta B: 80 % z 500 = 400"},
  {h:"Zdražení funguje stejně",t:"Zdraží-li se o 15 %, platíš 115 % původní ceny.\n\nRychlý převod: 115 % je 1,15. Původní cenu prostě vynásob tímto číslem.",f:"200 Kč + 15 %\n200 · 1,15 = 230 Kč"},
  {h:"Jistina, úrok a úroková míra",t:"Jistina je vložená částka. Úroková míra je procento za rok. Úrok je to, co ti banka připíše.\n\nÚrok za jeden rok spočítáš jako procento z jistiny — přesně jako každá jiná procentová úloha.",f:"jistina 20 000 Kč\núroková míra 3 % p. a.\núrok = 3 % z 20 000 = 600 Kč"},
  {h:"Daň z úroku",t:"Z připsaného úroku si stát bere daň — u nás 15 %. Daň se počítá z úroku, ne z jistiny.\n\nNa účet ti tedy dorazí jen 85 % úroku.",f:"úrok 600 Kč\ndaň: 15 % z 600 = 90 Kč\nčistý úrok: 510 Kč"},
  {h:"Inflace jednoduše",t:"Inflace znamená, že ceny rostou a za stejné peníze koupíš míň.\n\nPři inflaci 5 % stojí zboží za 100 Kč o rok později 105 Kč. Počítá se úplně stejně jako zdražení.",f:"100 Kč při inflaci 5 %\n→ za rok 105 Kč"}
 ],
 ulohy:[
  {q:"Vypočti 35 % z 240.",typ:"open",odp:"84",
   kroky:[{n:"Krok 1 — spočítej jedno procento",d:"Základ vyděl stem.",f:"240 : 100 = 2,4"},
    {n:"Krok 2 — vynásob počtem procent",d:"",f:"35 · 2,4 = 84"}],
   vys:"84"},
  {q:"Kabát stál 1 200 Kč a zlevnil o 30 %. Kolik stojí teď?",typ:"open",odp:"840",
   kroky:[{n:"Krok 1 — kolik zbude po slevě",d:"Sleva 30 % znamená, že platíš 70 % ceny. Tahle cesta je rychlejší než počítat slevu zvlášť.",f:"100 % − 30 % = 70 %"},
    {n:"Krok 2 — spočítej 70 % z ceny",d:"1 % je 12 Kč, sedmdesát procent je 70·12.",f:"70 · 12 = 840 Kč"},
    {n:"Kontrola druhou cestou",d:"Sleva by byla 30·12 = 360. A 1 200 − 360 = 840. Sedí.",f:"840 Kč"}],
   vys:"840 Kč"},
  {q:"Kolik procent je 45 ze 180?",typ:"open",odp:"25",
   kroky:[{n:"Krok 1 — urči, co je základ",d:"Celek je 180, hledáme, jakou je 45 jeho částí.",f:"základ = 180"},
    {n:"Krok 2 — spočítej jedno procento",d:"",f:"180 : 100 = 1,8"},
    {n:"Krok 3 — kolikrát se vejde do 45",d:"",f:"45 : 1,8 = 25 %"}],
   vys:"25 %"},
  {q:"Po zdražení o 20 % stojí zboží 360 Kč. Kolik stálo před zdražením?",typ:"open",odp:"300",
   kroky:[{n:"Krok 1 — pozor, co je základ",d:"Tady je past. Základ je PŮVODNÍ cena, ne ta nová. Nová cena je 120 % původní.",f:"360 Kč = 120 %"},
    {n:"Krok 2 — spočítej jedno procento",d:"Vyděl 360 stem dvaceti, ne stem.",f:"360 : 120 = 3 Kč"},
    {n:"Krok 3 — původní cena je 100 %",d:"",f:"100 · 3 = 300 Kč"},
    {n:"Zkouška",d:"300 + 20 % z 300 = 300 + 60 = 360. Sedí.",f:"300 Kč"}],
   vys:"300 Kč"},
  {q:"Uložíš 20 000 Kč na rok při úrokové míře 4 %. Kolik korun je úrok před zdaněním?",typ:"open",odp:"800",
   kroky:[{n:"Krok 1 — urči jistinu",d:"Vložená částka je jistina, tedy základ.",f:"jistina = 20 000 Kč"},
    {n:"Krok 2 — spočítej 4 %",d:"1 % je 200 Kč.",f:"4 · 200 = 800 Kč"}],
   vys:"800 Kč"},
  {q:"Úrok činí 800 Kč, daň z úroku je 15 %. Kolik korun ti reálně přibude na účtu?",typ:"open",odp:"680",
   kroky:[{n:"Krok 1 — daň se počítá z úroku",d:"Ne z jistiny. Základem je 800 Kč.",f:"základ = 800 Kč"},
    {n:"Krok 2 — spočítej daň",d:"1 % z 800 je 8 Kč.",f:"15 · 8 = 120 Kč"},
    {n:"Krok 3 — odečti daň od úroku",d:"Nebo rovnou 85 % z 800.",f:"800 − 120 = 680 Kč"}],
   vys:"680 Kč"},
  {q:"Ve třídě je 25 žáků, 60 % z nich jsou dívky. Kolik je ve třídě chlapců?",typ:"open",odp:"10",
   kroky:[{n:"Krok 1 — kolik procent jsou chlapci",d:"Nejrychlejší je počítat rovnou to, na co se ptají.",f:"100 % − 60 % = 40 %"},
    {n:"Krok 2 — spočítej 40 % z 25",d:"1 % je 0,25 žáka.",f:"40 · 0,25 = 10"},
    {n:"Kontrola",d:"Dívek je 15, chlapců 10, dohromady 25. Sedí.",f:"10 chlapců"}],
   vys:"10 chlapců"},
  {q:"Cena výrobku je vyšší než 100 Kč. Dvacet procent ceny je y korun. Který zápis vyjadřuje polovinu ceny výrobku?",typ:"choice",
   moz:["½ · 5y","y + 30","5y − 50","y + 0,3y"],spr:0,
   kroky:[{n:"Krok 1 — vyjádři celou cenu",d:"Když 20 % je y, pak 100 % je pětkrát tolik.",f:"celá cena = 5y"},
    {n:"Krok 2 — polovina ceny",d:"Vezmi polovinu z 5y.",f:"½ · 5y"},
    {n:"Proč ne ostatní",d:"Zápisy s pevnými čísly jako +30 nebo −50 nemohou platit pro libovolnou cenu.",f:"½ · 5y  ✓"}],
   vys:"½ · 5y"},
  {q:"Zboží zdraží o 10 % a pak zlevní o 10 %. Jaká bude výsledná cena oproti původní?",typ:"choice",
   moz:["O něco nižší než původní","Přesně původní","O něco vyšší než původní","O 20 % nižší"],spr:0,
   kroky:[{n:"Krok 1 — zkus to na konkrétním čísle",d:"Vezmi 100 Kč, počítá se s tím nejlíp.",f:"původní cena 100 Kč"},
    {n:"Krok 2 — zdražení o 10 %",d:"",f:"100 · 1,1 = 110 Kč"},
    {n:"Krok 3 — sleva 10 % z NOVÉ ceny",d:"Tady je jádro věci. Sleva se počítá ze 110, ne ze 100.",f:"110 · 0,9 = 99 Kč"},
    {n:"Krok 4 — závěr",d:"Vyšlo 99 Kč, tedy o korunu míň. Procenta se nesčítají a neodčítají, protože pokaždé mají jiný základ.",f:"o něco nižší  ✓"}],
   vys:"O něco nižší než původní — vyjde 99 % ceny"},
  {q:"Kolik korun je 150 % z 60?",typ:"open",odp:"90",
   kroky:[{n:"Krok 1 — víc než sto procent je v pořádku",d:"Znamená to prostě víc než celek.",f:"1 % z 60 = 0,6"},
    {n:"Krok 2 — vynásob",d:"",f:"150 · 0,6 = 90"},
    {n:"Rychlejší cesta",d:"150 % je jedenapůlkrát, tedy 60 + polovina z 60.",f:"60 + 30 = 90"}],
   vys:"90"}
 ]
},
{
 id:"mat-soustavy", predmet:"Matematika", ikona:"⚌",
 nazev:"Soustavy dvou rovnic",
 popis:"Dosazovací a sčítací metoda. Dvě neznámé, dvě rovnice — a slovní úlohy, kde se to hodí.",
 vyklad:[
  {h:"Proč dvě rovnice",t:"Máš-li dvě neznámé, jedna rovnice ti nestačí — řešení by bylo nekonečně mnoho. Potřebuješ dvě nezávislé informace.\n\nCíl je vždycky stejný: zbavit se jedné neznámé a dostat obyčejnou rovnici.",f:"x + y = 10\nx − y = 2\n→ x = 6, y = 4"},
  {h:"Dosazovací metoda",t:"Z jedné rovnice vyjádři jednu neznámou a dosaď ji do druhé rovnice.\n\nHodí se, když už je někde neznámá osamocená nebo má koeficient 1.",f:"x + y = 10  →  x = 10 − y\ndosadíme do druhé:\n(10 − y) − y = 2"},
  {h:"Sčítací metoda",t:"Rovnice sečti nebo odečti tak, aby se jedna neznámá vyrušila.\n\nČasto musíš jednu rovnici nejdřív vynásobit, aby koeficienty vyšly opačné.",f:"x + y = 10\nx − y = 2\nsečteme:  2x = 12  →  x = 6"},
  {h:"Kdy je nutné násobit",t:"Když se koeficienty samy nevyruší, vynásob celou rovnici vhodným číslem.\n\nCílem je dostat u jedné neznámé stejná čísla s opačným znaménkem.",f:"2x + 3y = 12   | ·2\n3x − 2y = 5    | ·3\n4x + 6y = 24\n9x − 6y = 15  → sečti"},
  {h:"Nezapomeň na druhou neznámou",t:"Když najdeš x, ještě nejsi hotová. Dosaď ho zpátky do kterékoli původní rovnice a dopočítej y.\n\nŘešením soustavy je vždycky dvojice čísel.",f:"x = 6 dosadíme:\n6 + y = 10  →  y = 4\nřešení: [6, 4]"},
  {h:"Zkouška do obou rovnic",t:"Zkouška musí projít v OBOU rovnicích. Kdyby platila jen v jedné, řešení je špatně.\n\nTohle je nejjistější způsob, jak odhalit chybu.",f:"6 + 4 = 10  ✓\n6 − 4 = 2   ✓"},
  {h:"Slovní úlohy o dvou neznámých",t:"Postup je vždy stejný: pojmenuj obě neznámé, napiš dvě rovnice podle dvou informací ze zadání, vyřeš.\n\nTypicky jedna rovnice popisuje počty a druhá ceny nebo hmotnosti.",f:"počet: x + y = 30\ncena:  2x + 5y = 105"}
 ],
 ulohy:[
  {q:"Řeš soustavu:\n\nx + y = 12\nx − y = 4",typ:"open",odp:"8",
   kroky:[{n:"Krok 1 — vyber metodu",d:"U y jsou koeficienty +1 a −1. Stačí rovnice sečíst a y zmizí.",f:"sčítací metoda"},
    {n:"Krok 2 — sečti obě rovnice",d:"Vlevo x + x = 2x, y a −y se vyruší. Vpravo 12 + 4.",f:"2x = 16"},
    {n:"Krok 3 — dopočítej x",d:"",f:"x = 8"},
    {n:"Krok 4 — dosaď pro y",d:"Do první rovnice.",f:"8 + y = 12  →  y = 4"},
    {n:"Zkouška v obou rovnicích",d:"",f:"8 + 4 = 12 ✓ ,  8 − 4 = 4 ✓"}],
   vys:"x = 8, y = 4 (odpověď x = 8)"},
  {q:"Řeš soustavu a napiš hodnotu x:\n\ny = 2x\nx + y = 9",typ:"open",odp:"3",
   kroky:[{n:"Krok 1 — y už je vyjádřené",d:"První rovnice rovnou říká, čemu se y rovná. Použijeme dosazovací metodu.",f:"y = 2x"},
    {n:"Krok 2 — dosaď do druhé rovnice",d:"Místo y napiš 2x.",f:"x + 2x = 9"},
    {n:"Krok 3 — vyřeš",d:"",f:"3x = 9  →  x = 3"},
    {n:"Krok 4 — dopočítej y",d:"",f:"y = 2·3 = 6"}],
   vys:"x = 3, y = 6"},
  {q:"Řeš soustavu a napiš hodnotu x:\n\n2x + y = 11\n3x − y = 9",typ:"open",odp:"4",
   kroky:[{n:"Krok 1 — všimni si y",d:"V první rovnici je +y, ve druhé −y. Po sečtení se vyruší.",f:"sčítací metoda"},
    {n:"Krok 2 — sečti",d:"2x + 3x = 5x, y − y = 0, 11 + 9 = 20.",f:"5x = 20"},
    {n:"Krok 3 — dopočítej",d:"",f:"x = 4"},
    {n:"Krok 4 — dosaď pro y",d:"",f:"2·4 + y = 11  →  y = 3"}],
   vys:"x = 4, y = 3"},
  {q:"Řeš soustavu a napiš hodnotu x:\n\n3x + 2y = 16\nx − 2y = 0",typ:"open",odp:"4",
   kroky:[{n:"Krok 1 — koeficienty u y",d:"+2y a −2y se po sečtení vyruší.",f:"sčítací metoda"},
    {n:"Krok 2 — sečti rovnice",d:"",f:"4x = 16"},
    {n:"Krok 3 — dopočítej x a y",d:"",f:"x = 4,  pak 4 − 2y = 0  →  y = 2"},
    {n:"Zkouška",d:"3·4 + 2·2 = 16 ✓ a 4 − 4 = 0 ✓",f:"x = 4, y = 2"}],
   vys:"x = 4, y = 2"},
  {q:"SLOVNÍ ÚLOHA\n\nV kleci jsou králíci a slepice. Dohromady mají 12 hlav a 34 nohou. Kolik je tam králíků?",typ:"open",odp:"5",
   kroky:[{n:"Krok 1 — pojmenuj neznámé",d:"Králíky označ k, slepice s.",f:"k … králíci, s … slepice"},
    {n:"Krok 2 — první rovnice podle hlav",d:"Každé zvíře má jednu hlavu.",f:"k + s = 12"},
    {n:"Krok 3 — druhá rovnice podle nohou",d:"Králík má čtyři nohy, slepice dvě.",f:"4k + 2s = 34"},
    {n:"Krok 4 — dosaď",d:"Z první rovnice s = 12 − k. Dosadíme do druhé.",f:"4k + 2(12 − k) = 34"},
    {n:"Krok 5 — vyřeš",d:"Roznásob a sečti.",f:"4k + 24 − 2k = 34\n2k = 10  →  k = 5"},
    {n:"Zkouška",d:"5 králíků a 7 slepic. Hlav 12 ✓, nohou 20 + 14 = 34 ✓",f:"5 králíků"}],
   vys:"5 králíků (a 7 slepic)"},
  {q:"SLOVNÍ ÚLOHA\n\nZa 3 rohlíky a 2 housky zaplatíš 26 Kč. Za 1 rohlík a 4 housky zaplatíš 32 Kč. Kolik korun stojí jeden rohlík?",typ:"open",odp:"4",
   kroky:[{n:"Krok 1 — pojmenuj neznámé",d:"Cena rohlíku r, cena housky h.",f:"3r + 2h = 26\nr + 4h = 32"},
    {n:"Krok 2 — vyjádři r z druhé rovnice",d:"Tam stojí r osamoceně, je to nejjednodušší.",f:"r = 32 − 4h"},
    {n:"Krok 3 — dosaď do první",d:"",f:"3(32 − 4h) + 2h = 26"},
    {n:"Krok 4 — vyřeš",d:"Roznásob a seber členy.",f:"96 − 12h + 2h = 26\n−10h = −70  →  h = 7"},
    {n:"Krok 5 — dopočítej rohlík",d:"",f:"r = 32 − 4·7 = 4 Kč"},
    {n:"Zkouška",d:"3·4 + 2·7 = 12 + 14 = 26 ✓",f:"rohlík stojí 4 Kč"}],
   vys:"Rohlík 4 Kč, houska 7 Kč"},
  {q:"SLOVNÍ ÚLOHA\n\nSoučet dvou čísel je 40, jejich rozdíl je 8. Které je to větší číslo?",typ:"open",odp:"24",
   kroky:[{n:"Krok 1 — napiš soustavu",d:"",f:"x + y = 40\nx − y = 8"},
    {n:"Krok 2 — sečti rovnice",d:"y se vyruší.",f:"2x = 48  →  x = 24"},
    {n:"Krok 3 — dopočítej druhé číslo",d:"",f:"24 + y = 40  →  y = 16"},
    {n:"Zkouška",d:"Součet 40 ✓, rozdíl 24 − 16 = 8 ✓",f:"větší číslo je 24"}],
   vys:"24 (druhé je 16)"},
  {q:"Kolik řešení má soustava?\n\nx + y = 5\n2x + 2y = 10",typ:"choice",
   moz:["Nekonečně mnoho","Právě jedno","Žádné","Právě dvě"],spr:0,
   kroky:[{n:"Krok 1 — porovnej rovnice",d:"Druhá rovnice je přesně dvojnásobek první. Neříká nám nic nového.",f:"2·(x + y) = 2·5"},
    {n:"Krok 2 — zkus sčítací metodu",d:"Vynásob první rovnici −2 a přičti ke druhé.",f:"0 = 0"},
    {n:"Krok 3 — závěr",d:"Zbylo pravdivé tvrzení, ale obě neznámé zmizely. Řešením je každá dvojice, která splňuje x + y = 5.",f:"nekonečně mnoho řešení"}],
   vys:"Nekonečně mnoho řešení"}
 ]
},
{
 id:"mat-pythagoras", predmet:"Matematika", ikona:"📐",
 nazev:"Pythagorova věta",
 popis:"Výpočet stran pravoúhlého trojúhelníku, úhlopříčky v obdélníku, krychli i kvádru. V testu bývá každý rok.",
 vyklad:[
  {h:"Kdy ji smíš použít",t:"Pythagorova věta platí JEN v pravoúhlém trojúhelníku. Nikde jinde.\n\nNejdřív se vždycky ujisti, že v úloze pravý úhel opravdu je — často je schovaný v obdélníku, ve čtverci nebo ve výšce trojúhelníku.",f:"jen když je v trojúhelníku 90°"},
  {h:"Odvěsny a přepona",t:"Přepona je nejdelší strana a leží vždycky NAPROTI pravému úhlu. Zbylé dvě strany jsou odvěsny.\n\nZáměna přepony a odvěsny je nejčastější chyba v celém okruhu. Než začneš počítat, najdi si pravý úhel a podívej se naproti.",f:"c … přepona (naproti 90°)\na, b … odvěsny"},
  {h:"Samotná věta",t:"Obsah čtverce nad přeponou se rovná součtu obsahů čtverců nad oběma odvěsnami.\n\nJinými slovy: druhá mocnina přepony je součet druhých mocnin odvěsen.",f:"c² = a² + b²",
   svg:'<svg class="vis" viewBox="0 0 260 150" xmlns="http://www.w3.org/2000/svg"><polygon points="40,120 160,120 40,40" fill="none" stroke="#f4f1e8" stroke-width="2.5"/><rect x="40" y="105" width="15" height="15" fill="none" stroke="#ffd84d" stroke-width="2"/><text x="95" y="138" fill="#7fe3ff" font-size="15" font-weight="700" text-anchor="middle" font-family="sans-serif">a</text><text x="26" y="85" fill="#7fe3ff" font-size="15" font-weight="700" text-anchor="middle" font-family="sans-serif">b</text><text x="112" y="72" fill="#ff8ad1" font-size="15" font-weight="700" text-anchor="middle" font-family="sans-serif">c</text><text x="205" y="80" fill="#ffd84d" font-size="14" font-weight="700" text-anchor="middle" font-family="sans-serif">c² = a² + b²</text></svg>'},
  {h:"Hledáš přeponu — sčítáš",t:"Známe obě odvěsny a hledáme přeponu? Umocni je, sečti a odmocni.\n\nVýsledek musí být větší než každá odvěsna. Když ti vyjde menší, něco je špatně.",f:"a = 3, b = 4\nc² = 9 + 16 = 25\nc = 5"},
  {h:"Hledáš odvěsnu — odčítáš",t:"Známe přeponu a jednu odvěsnu? Pak od čtverce přepony ODEČTI čtverec známé odvěsny.\n\nTady se plete znaménko nejčastěji. Pomůcka: odvěsna musí vyjít menší než přepona.",f:"c = 13, a = 5\nb² = 169 − 25 = 144\nb = 12"},
  {h:"Slavné trojice, které se vyplatí znát",t:"Některé trojice čísel vycházejí pěkně a v testech se objevují pořád dokola.\n\nZnáš-li je, ušetříš čas i chyby. Platí i jejich násobky — třeba 6, 8, 10.",f:"3 – 4 – 5\n5 – 12 – 13\n8 – 15 – 17\n(a jejich násobky)"},
  {h:"Úhlopříčka obdélníku",t:"Úhlopříčka rozdělí obdélník na dva pravoúhlé trojúhelníky. Strany obdélníku jsou odvěsny, úhlopříčka je přepona.\n\nU čtverce se strany rovnají, takže úhlopříčka je strana krát odmocnina ze dvou.",f:"obdélník 6 × 8\nu² = 36 + 64 = 100\nu = 10"},
  {h:"Tělesová úhlopříčka kvádru",t:"V kvádru se věta používá dvakrát za sebou. Nejdřív spočítáš úhlopříčku podstavy, ta se pak stane odvěsnou.\n\nExistuje i zkratka — jeden vzorec pro všechny tři hrany najednou.",f:"nejdřív: u² = a² + b²\npotom:   U² = u² + c²\nzkratka: U² = a² + b² + c²"}
 ],
 ulohy:[
  {q:"Odvěsny pravoúhlého trojúhelníku měří 6 cm a 8 cm. Jak dlouhá je přepona? (v cm)",typ:"open",odp:"10",
   kroky:[{n:"Krok 1 — co hledáme",d:"Známe obě odvěsny, hledáme přeponu. Budeme tedy sčítat.",f:"c² = a² + b²"},
    {n:"Krok 2 — dosaď a umocni",d:"",f:"c² = 6² + 8² = 36 + 64 = 100"},
    {n:"Krok 3 — odmocni",d:"",f:"c = √100 = 10 cm"},
    {n:"Kontrola",d:"Je to násobek slavné trojice 3–4–5, jen dvakrát větší. Sedí.",f:"10 cm"}],
   vys:"10 cm"},
  {q:"Přepona měří 13 cm, jedna odvěsna 5 cm. Jak dlouhá je druhá odvěsna? (v cm)",typ:"open",odp:"12",
   kroky:[{n:"Krok 1 — hledáme odvěsnu, takže odčítáme",d:"Přepona je vždy ta největší strana, tedy 13 cm.",f:"b² = c² − a²"},
    {n:"Krok 2 — dosaď",d:"",f:"b² = 13² − 5² = 169 − 25 = 144"},
    {n:"Krok 3 — odmocni",d:"",f:"b = √144 = 12 cm"},
    {n:"Kontrola",d:"Trojice 5–12–13 je jedna z těch, které se vyplatí znát zpaměti.",f:"12 cm"}],
   vys:"12 cm"},
  {q:"Obdélník má rozměry 9 cm a 12 cm. Jak dlouhá je jeho úhlopříčka? (v cm)",typ:"open",odp:"15",
   kroky:[{n:"Krok 1 — najdi pravoúhlý trojúhelník",d:"Úhlopříčka rozdělí obdélník na dva pravoúhlé trojúhelníky. Strany obdélníku jsou odvěsny.",f:"a = 9, b = 12"},
    {n:"Krok 2 — použij větu",d:"",f:"u² = 81 + 144 = 225"},
    {n:"Krok 3 — odmocni",d:"",f:"u = √225 = 15 cm"},
    {n:"Poznámka",d:"Je to trojnásobek trojice 3–4–5.",f:"15 cm"}],
   vys:"15 cm"},
  {q:"Čtverec má stranu 5 cm. Jaký je obsah čtverce sestrojeného nad jeho úhlopříčkou? (v cm²)",typ:"open",odp:"50",
   kroky:[{n:"Krok 1 — spočítej druhou mocninu úhlopříčky",d:"Nemusíš vůbec odmocňovat! Obsah čtverce nad úhlopříčkou je právě u².",f:"u² = 5² + 5² = 50"},
    {n:"Krok 2 — a to je rovnou výsledek",d:"Obsah čtverce se stranou u je u², což už máme.",f:"S = 50 cm²"},
    {n:"Chytrá zkratka",d:"Kdybys počítala u = √50 a pak to zase umocnila, dostaneš totéž — jen s většími čísly a rizikem zaokrouhlení.",f:"50 cm²"}],
   vys:"50 cm²"},
  {q:"Krychle má hranu 6 cm. Jak dlouhá je její stěnová úhlopříčka? (zaokrouhli na desetiny cm)",typ:"open",odp:"8.5",
   kroky:[{n:"Krok 1 — stěna krychle je čtverec",d:"Stěnová úhlopříčka je úhlopříčka čtverce o straně 6.",f:"u² = 6² + 6² = 72"},
    {n:"Krok 2 — odmocni",d:"√72 je mezi 8 a 9, protože 8² = 64 a 9² = 81.",f:"u = √72 ≈ 8,49"},
    {n:"Krok 3 — zaokrouhli",d:"",f:"u ≈ 8,5 cm"}],
   vys:"přibližně 8,5 cm"},
  {q:"Kvádr má hrany 3 cm, 4 cm a 12 cm. Jak dlouhá je tělesová úhlopříčka? (v cm)",typ:"open",odp:"13",
   kroky:[{n:"Krok 1 — úhlopříčka podstavy",d:"Nejdřív spočítej úhlopříčku obdélníkové podstavy 3 × 4.",f:"u² = 9 + 16 = 25,  u = 5"},
    {n:"Krok 2 — druhý pravoúhlý trojúhelník",d:"Úhlopříčka podstavy (5) a výška (12) jsou odvěsny nového trojúhelníku. Tělesová úhlopříčka je jeho přepona.",f:"U² = 5² + 12² = 25 + 144 = 169"},
    {n:"Krok 3 — odmocni",d:"",f:"U = 13 cm"},
    {n:"Zkratka",d:"Šlo to i najednou: U² = 3² + 4² + 12² = 9 + 16 + 144 = 169.",f:"13 cm"}],
   vys:"13 cm"},
  {q:"Žebřík dlouhý 5 m je opřený o zeď. Jeho pata je 3 m od zdi. Do jaké výšky sahá? (v m)",typ:"open",odp:"4",
   kroky:[{n:"Krok 1 — nakresli si to",d:"Zeď je svislá, země vodorovná — mezi nimi je pravý úhel. Žebřík je přepona.",f:"c = 5 (žebřík), a = 3 (vzdálenost)"},
    {n:"Krok 2 — hledáme odvěsnu, tedy odčítáme",d:"",f:"b² = 25 − 9 = 16"},
    {n:"Krok 3 — odmocni",d:"",f:"b = 4 m"},
    {n:"Ověř úsudkem",d:"Výška musí být menší než délka žebříku. 4 < 5, sedí.",f:"4 m"}],
   vys:"4 m"},
  {q:"Rozhodni, zda trojúhelník se stranami 7, 24 a 25 je pravoúhlý.",typ:"choice",
   moz:["Ano, je pravoúhlý","Ne, není pravoúhlý","Nelze rozhodnout","Je rovnostranný"],spr:0,
   kroky:[{n:"Krok 1 — najdi nejdelší stranu",d:"Kdyby byl pravoúhlý, byla by přeponou. Tady je to 25.",f:"c = 25, a = 7, b = 24"},
    {n:"Krok 2 — spočítej obě strany rovnice zvlášť",d:"Vlevo čtverec přepony, vpravo součet čtverců odvěsen.",f:"25² = 625\n7² + 24² = 49 + 576 = 625"},
    {n:"Krok 3 — porovnej",d:"Obě strany se rovnají, věta platí. To znamená, že trojúhelník pravoúhlý JE.",f:"625 = 625  →  ano ✓"}],
   vys:"Ano, je pravoúhlý"},
  {q:"Rovnoramenný trojúhelník má základnu 16 cm a ramena 10 cm. Jak vysoký je? (v cm)",typ:"open",odp:"6",
   kroky:[{n:"Krok 1 — výška půlí základnu",d:"U rovnoramenného trojúhelníku spadne výška přesně doprostřed základny a vytvoří pravý úhel.",f:"polovina základny = 8 cm"},
    {n:"Krok 2 — najdi pravoúhlý trojúhelník",d:"Rameno je přepona (10), polovina základny odvěsna (8), výška druhá odvěsna.",f:"v² = 10² − 8²"},
    {n:"Krok 3 — dopočítej",d:"",f:"v² = 100 − 64 = 36\nv = 6 cm"}],
   vys:"6 cm"},
  {q:"Televize má úhlopříčku 100 cm a šířku 80 cm. Jak vysoká je obrazovka? (v cm)",typ:"open",odp:"60",
   kroky:[{n:"Krok 1 — obrazovka je obdélník",d:"Úhlopříčka je přepona, šířka a výška jsou odvěsny.",f:"c = 100, a = 80"},
    {n:"Krok 2 — odčítej",d:"",f:"b² = 10 000 − 6 400 = 3 600"},
    {n:"Krok 3 — odmocni",d:"",f:"b = 60 cm"},
    {n:"Poznámka",d:"Opět násobek trojice 3–4–5, tentokrát dvacetkrát.",f:"60 cm"}],
   vys:"60 cm"}
 ]
},
{
 id:"mat-obsahy", predmet:"Matematika", ikona:"⬜",
 nazev:"Obvody a obsahy rovinných útvarů",
 popis:"Trojúhelník, obdélník, lichoběžník a hlavně kruh. Včetně složených obrazců, které test miluje.",
 vyklad:[
  {h:"Obvod versus obsah",t:"Obvod je délka čáry kolem dokola — měří se v centimetrech.\n\nObsah je plocha uvnitř — měří se v centimetrech čtverečních. Když si spleteš jednotku, poznáš, že jsi spletla i vzorec.",f:"obvod → cm, m, km\nobsah → cm², m², km²"},
  {h:"Obdélník a čtverec",t:"U obdélníku obvod sečteš dvě strany a vynásobíš dvěma, obsah vynásobíš strany.\n\nČtverec je jen zvláštní obdélník, kde jsou obě strany stejné.",f:"obdélník: o = 2(a + b),  S = a·b\nčtverec:  o = 4a,  S = a²"},
  {h:"Trojúhelník",t:"Obsah trojúhelníku je polovina součinu strany a výšky K TÉ STRANĚ.\n\nVýška musí být kolmá právě k té straně, kterou jsi použila. Tady se chybuje.",f:"S = a · v / 2"},
  {h:"Rovnoběžník a lichoběžník",t:"U rovnoběžníku je obsah strana krát výška — bez dělení dvěma.\n\nU lichoběžníku sečteš obě rovnoběžné strany, vynásobíš výškou a vydělíš dvěma.",f:"rovnoběžník: S = a · v\nlichoběžník: S = (a + c) · v / 2"},
  {h:"Kruh a kružnice",t:"Kružnice je jen ta čára, kruh je i s vnitřkem. Proto má kružnice délku a kruh obsah.\n\nČíslo π je přibližně 3,14. Průměr je dvojnásobek poloměru.",f:"délka kružnice: o = 2πr = πd\nobsah kruhu:    S = πr²"},
  {h:"Pozor na poloměr a průměr",t:"Nejčastější chyba v celém okruhu: do vzorce dosadíš průměr místo poloměru.\n\nKdyž zadání říká „kruh o průměru 10 cm“, do vzorce patří pětka, ne desítka.",f:"d = 10 cm  →  r = 5 cm\nS = π·5² = 78,5 cm²"},
  {h:"Složené obrazce",t:"Složitý tvar rozděl na jednoduché části — obdélníky, trojúhelníky, půlkruhy.\n\nObsahy pak sečti. Když je v obrazci díra, obsah díry naopak odečti.",f:"S = S₁ + S₂ − S₃"},
  {h:"Vztah mezi rozměry a obsahem",t:"Zvětšíš-li stranu dvakrát, obsah se zvětší čtyřikrát. Trojnásobná strana znamená devítinásobný obsah.\n\nJe to proto, že obsah závisí na druhé mocnině rozměru.",f:"strana ·2  →  obsah ·4\nstrana ·3  →  obsah ·9"}
 ],

{
 id:"mat-telesa", predmet:"Matematika", ikona:"🧊",

 vyklad:[

  {h:"Jehlan a kužel — nezapomeň na třetinu",t:"Špičatá tělesa mají objem přesně třikrát menší než hranol nebo válec se stejnou podstavou a výškou.\n\nTa třetina je to, co se u nich nejčastěji zapomíná.",f:"jehlan: V = S_podstavy · v / 3\nkužel:  V = π r² · v / 3"},
  {h:"Výška versus strana u kužele",t:"U kužele rozlišuj výšku (kolmo od vrcholu do středu podstavy) a stranu (od vrcholu k okraji podstavy).\n\nJsou spojené Pythagorovou větou. Do objemu patří výška, do pláště strana.",f:"s² = r² + v²\nplášť kužele: π r · s"},
  {h:"Koule",t:"U koule si stačí zapamatovat dva vzorce. Oba obsahují poloměr na třetí, respektive na druhou.\n\nPomůcka na objem: čtyři třetiny pí er na třetí.",f:"V = 4/3 · π r³\nS = 4 π r²"},
  {h:"Převody objemových jednotek",t:"Tohle je v testu častější zdroj chyb než samotné vzorce.\n\nJeden litr je krychle o hraně 10 cm, tedy tisíc centimetrů krychlových. Krychlový metr je tisíc litrů.",f:"1 l = 1 dm³ = 1 000 cm³\n1 m³ = 1 000 l\n1 hl = 100 l"},
  {h:"Síť tělesa",t:"Síť je těleso rozstřižené a rozložené do roviny. Její obsah je přesně povrch tělesa.\n\nU válce se plášť rozvine na obdélník o rozměrech 2πr a v — to je dobré si představit.",f:"obsah sítě = povrch tělesa"}
 ],

{
 id:"mat-funkce", predmet:"Matematika", ikona:"📈",
 nazev:"Funkce, závislosti a grafy",
 popis:"Lineární funkce, čtení z grafu a tabulky, přímá i nepřímá úměrnost jako funkce.",
 vyklad:[
  {h:"Co je funkce",t:"Funkce je předpis, který každé hodnotě x přiřadí právě jednu hodnotu y.\n\nMůže být zapsaná rovnicí, tabulkou nebo grafem. Všechny tři zápisy říkají totéž.",f:"y = 2x + 1\nx = 3  →  y = 7"},
  {h:"Lineární funkce a její graf",t:"Lineární funkce má tvar y = ax + b a jejím grafem je vždycky přímka.\n\nČíslo a určuje sklon, číslo b říká, kde přímka protíná svislou osu.",f:"y = 2x + 1\nsklon 2, protíná osu y v bodě 1"},
  {h:"Rostoucí, nebo klesající?",t:"Rozhoduje znaménko u čísla a.\n\nKladné a znamená, že přímka stoupá zleva doprava. Záporné a znamená, že klesá. Nulové a dá vodorovnou přímku.",f:"y = 3x − 2   → rostoucí\ny = −3x + 2  → klesající\ny = 5        → vodorovná"},
  {h:"Jak sestrojit graf",t:"Přímka je určená dvěma body. Vyber si dvě jednoduchá x, dopočítej y a body spoj.\n\nNejjednodušší bývá x = 0 a x = 1, případně x = 0 a takové x, kde vyjde y = 0.",f:"y = 2x − 4\nx = 0 → y = −4\nx = 2 → y = 0"},
  {h:"Leží bod na grafu?",t:"Souřadnice bodu prostě dosaď do rovnice. Vyjde-li pravdivá rovnost, bod na grafu leží.\n\nPrvní číslo v hranaté závorce je x, druhé y.",f:"Leží [3, 5] na y = 2x − 1?\n5 = 2·3 − 1 = 5  ✓ ano"},
  {h:"Přímá a nepřímá úměrnost jako funkce",t:"Přímá úměrnost je zvláštní lineární funkce y = kx — bez absolutního členu, takže prochází počátkem.\n\nNepřímá úměrnost má tvar y = k/x a jejím grafem je hyperbola.",f:"přímá:   y = k·x  (přímka počátkem)\nnepřímá: y = k/x  (hyperbola)"},
  {h:"Čtení z grafu",t:"V testu se často jen odečítá. Hledáš-li y pro dané x, jdi od osy x nahoru ke grafu a pak doleva na osu y.\n\nOpačným směrem to funguje stejně.",f:"x → nahoru ke grafu → doleva na y"}
 ],

    {n:"Ověř na číslech",d:"Pro x = 0 je y = 1, pro x = 1 je y = −3. y opravdu klesá.",f:"klesající ✓"}],

  {q:"Leží bod [2, 7] na grafu funkce y = 3x + 1?",typ:"choice",

    {n:"Krok 3 — porovnej",d:"Vyšlo přesně 7, což se rovná souřadnici y. Bod tedy na grafu leží.",f:"7 = 7  ✓"}],

  {q:"Taxi má nástupní sazbu 40 Kč a za každý kilometr 25 Kč. Kolik zaplatíš za 12 km?",typ:"open",odp:"340",

  {q:"Které z funkcí je přímou úměrností?",typ:"choice",
   moz:["y = 4x","y = 4x + 2","y = 4/x","y = x² "],spr:0,
   kroky:[{n:"Krok 1 — co musí přímá úměrnost splňovat",d:"Musí mít tvar y = kx, tedy bez přičítaného čísla.",f:"y = k·x"},
    {n:"Krok 2 — projdi možnosti",d:"y = 4x + 2 má navíc dvojku, takže neprochází počátkem. y = 4/x je nepřímá úměrnost. y = x² není lineární.",f:"y = 4x  ✓"},
    {n:"Kontrola",d:"U přímé úměrnosti musí platit, že pro x = 0 je i y = 0. To splňuje jen první.",f:"y = 4x"}],

  {q:"V tabulce je: x = 2 → y = 10, x = 5 → y = 25. O jakou závislost jde?",typ:"choice",

   kroky:[{n:"Krok 1 — spočítej podíl y ku x",d:"U přímé úměrnosti musí být stejný v obou sloupcích.",f:"10 : 2 = 5\n25 : 5 = 5"},
    {n:"Krok 2 — podíly se shodují",d:"Koeficient je 5, závislost je přímá úměrnost.",f:"y = 5x"},
    {n:"Kontrola nepřímé",d:"U nepřímé by musel být stálý součin. 2·10 = 20, ale 5·25 = 125. Nesedí.",f:"přímá úměrnost, k = 5"}],
   vys:"Přímá úměrnost, y = 5x"},
  {q:"Vlak jede stálou rychlostí 80 km/h. Za jak dlouho ujede 200 km? (v hodinách, desetinné číslo)",typ:"open",odp:"2.5",
   kroky:[{n:"Krok 1 — vztah mezi dráhou, rychlostí a časem",d:"",f:"t = s : v"},

    {n:"Krok 3 — dopočítej",d:"To je dvě a půl hodiny, tedy 2 hodiny 30 minut.",f:"t = 2,5 h"}],
   vys:"2,5 hodiny"},
  {q:"Jak vypadá graf nepřímé úměrnosti?",typ:"choice",
   moz:["Hyperbola","Přímka počátkem","Parabola","Kružnice"],spr:0,
   kroky:[{n:"Krok 1 — jak vypadá předpis",d:"Nepřímá úměrnost má x ve jmenovateli.",f:"y = k / x"},
    {n:"Krok 2 — co to znamená pro graf",d:"Když je x malé, y je obrovské. Když je x velké, y se blíží nule. Křivka nikdy neprotne osy.",f:"hyperbola"},
    {n:"Pro srovnání",d:"Přímka počátkem patří přímé úměrnosti, parabola kvadratické funkci.",f:"hyperbola ✓"}],
   vys:"Hyperbola"}
 ]
},
{
 id:"mat-statistika", predmet:"Matematika", ikona:"📊",
 nazev:"Statistika a práce s daty",
 popis:"Aritmetický průměr, četnost, medián a čtení z tabulek a diagramů. Bodově vděčná část testu.",
 vyklad:[
  {h:"Základní pojmy",t:"Statistický soubor je skupina, kterou zkoumáme — třeba všichni žáci ve třídě.\n\nStatistický znak je to, co na nich sledujeme — třeba známka z matematiky.",f:"soubor: 25 žáků\nznak: známka"},
  {h:"Četnost",t:"Četnost říká, kolikrát se daná hodnota v souboru objevila.\n\nRelativní četnost je podíl z celku, obvykle v procentech. Součet všech četností musí dát velikost souboru.",f:"známka 2 se objevila 8×\nčetnost = 8\nrelativní = 8/25 = 32 %"},
  {h:"Aritmetický průměr",t:"Sečti všechny hodnoty a vyděl jejich počtem. To je celé.\n\nPozor: průměr je citlivý na jednu extrémní hodnotu, která ho umí hodně vychýlit.",f:"2, 3, 3, 4, 8\nsoučet 20, počet 5\nprůměr = 4"},
  {h:"Vážený průměr",t:"Když se některá hodnota opakuje, nemusíš ji psát pořád dokola. Vynásob ji četností.\n\nNa konci děl celkovým počtem, ne počtem různých hodnot.",f:"tři jedničky a dvě čtyřky:\n(3·1 + 2·4) : 5 = 11 : 5 = 2,2"},
  {h:"Medián",t:"Medián je prostřední hodnota, když čísla seřadíš od nejmenšího po největší.\n\nJe-li čísel sudý počet, medián je průměr dvou prostředních. Na rozdíl od průměru ho jedna extrémní hodnota nerozhodí.",f:"1, 2, 4, 7, 9  →  medián 4\n1, 2, 4, 7  →  (2+4)/2 = 3"},
  {h:"Modus",t:"Modus je hodnota, která se v souboru vyskytuje nejčastěji.\n\nMůže jich být i víc než jeden, nebo nemusí být žádný, když se všechno vyskytuje stejně často.",f:"3, 5, 5, 7, 9\nmodus = 5"},
  {h:"Který diagram na co",t:"Sloupcový diagram porovnává hodnoty mezi sebou. Kruhový výsečový ukazuje podíly z celku.\n\nSpojnicový se hodí na vývoj v čase. Test se často ptá právě na volbu vhodného grafu.",f:"porovnání → sloupcový\npodíly → výsečový\nvývoj v čase → spojnicový"}
 ],
 ulohy:[

    {n:"Krok 2 — najdi prostřední hodnotu",d:"Čísel je pět, prostřední je třetí v pořadí.",f:"medián = 5"}],

{
 id:"mat-geometrie", predmet:"Matematika", ikona:"🧭",
 nazev:"Konstrukce, kružnice a podobnost",
 popis:"Thaletova kružnice, osy, tečny, shodnost a podobnost trojúhelníků. Rýsovací část testu.",
 vyklad:[
  {h:"Množina bodů dané vlastnosti",t:"Spousta konstrukcí stojí na jediné myšlence: najít všechny body, které splňují nějakou podmínku.\n\nOsa úsečky jsou všechny body stejně vzdálené od obou krajních bodů. Osa úhlu jsou body stejně vzdálené od obou ramen.",f:"osa úsečky ⊥ a půlí ji\nosa úhlu půlí úhel"},
  {h:"Kružnice opsaná a vepsaná",t:"Střed kružnice OPSANÉ najdeš jako průsečík os stran. Prochází všemi vrcholy.\n\nStřed kružnice VEPSANÉ je průsečík os úhlů. Dotýká se všech stran zevnitř.",f:"opsaná → osy stran\nvepsaná → osy úhlů"},
  {h:"Thaletova kružnice",t:"Nad průměrem kružnice vidíš každý bod na kružnici pod pravým úhlem.\n\nJe to nejrychlejší způsob, jak sestrojit pravý úhel — a v testech se objevuje pořád.",f:"AB je průměr, C na kružnici\n→ úhel při C je vždy 90°",
   svg:'<svg class="vis" viewBox="0 0 240 130" xmlns="http://www.w3.org/2000/svg"><circle cx="120" cy="80" r="55" fill="none" stroke="#7fe3ff" stroke-width="2"/><line x1="65" y1="80" x2="175" y2="80" stroke="#f4f1e8" stroke-width="2.5"/><line x1="65" y1="80" x2="145" y2="31" stroke="#f4f1e8" stroke-width="2.5"/><line x1="175" y1="80" x2="145" y2="31" stroke="#f4f1e8" stroke-width="2.5"/><circle cx="120" cy="80" r="3" fill="#ffd84d"/><text x="58" y="95" fill="#f4f1e8" font-size="13" font-family="sans-serif">A</text><text x="178" y="95" fill="#f4f1e8" font-size="13" font-family="sans-serif">B</text><text x="150" y="26" fill="#ffd84d" font-size="13" font-family="sans-serif">C</text><text x="140" y="52" fill="#ff8ad1" font-size="12" font-family="sans-serif">90°</text></svg>'},
  {h:"Kružnice a přímka",t:"Přímka může kružnici protnout ve dvou bodech, dotknout se jí v jednom, nebo ji minout.\n\nTečna je vždycky KOLMÁ na poloměr v bodě dotyku. To je klíč k jejímu sestrojení.",f:"sečna … 2 průsečíky\ntečna … 1 bod dotyku\nvnější přímka … 0"},
  {h:"Tečna z bodu vně kružnice",t:"Postup se opírá o Thaletovu kružnici. Spoj střed s daným bodem, najdi střed té úsečky a opiš Thaletovu kružnici.\n\nKde protne původní kružnici, tam jsou body dotyku. Řešení jsou vždycky dvě.",f:"1. spoj S a bod M\n2. Thaletova kružnice nad SM\n3. průsečíky = body dotyku"},
  {h:"Shodnost trojúhelníků",t:"Shodné trojúhelníky mají stejné rozměry — dají se na sebe položit.\n\nStačí ověřit jednu ze čtyř vět: sss, sus, usu nebo Ssu.",f:"sss — tři strany\nsus — strana, úhel, strana\nusu — úhel, strana, úhel"},
  {h:"Podobnost trojúhelníků",t:"Podobné trojúhelníky mají stejný tvar, ale jinou velikost. Úhly jsou stejné, strany ve stejném poměru.\n\nTomu poměru se říká koeficient podobnosti.",f:"věty: sss, uu, sus\npoměr stran = k"},
  {h:"Kdy se podobnost hodí",t:"Podobnost se používá u map, plánů a všude, kde je něco zmenšené či zvětšené.\n\nZvětšíš-li rozměry k-krát, obsah se změní k²-krát a objem k³-krát. To se v testu ptají rádi.",f:"délky ·k\nobsah ·k²\nobjem ·k³"}
 ],

  {q:"Kde leží střed kružnice opsané trojúhelníku?",typ:"choice",

    {n:"Krok 2 — proč kolmost",d:"Kdyby kolmá nebyla, protla by kružnici ve dvou bodech a byla by to sečna.",f:"tečna ⊥ poloměr ✓"}],

  {q:"Zvětšíme-li rozměry čtverce dvakrát, kolikrát se zvětší jeho obsah?",typ:"choice",

{
 id:"cj-vyjmenovana", predmet:"Čeština", ikona:"🅱️",
 nazev:"Vyjmenovaná slova a i/y po obojetných",
 popis:"Kde psát tvrdé y a kde měkké i. Nejzákladnější pravopisný jev — a v testu bývá schovaný v delším textu.",
 vyklad:[
  {h:"Tři skupiny souhlásek",t:"Po tvrdých souhláskách h, ch, k, r, d, t, n se píše tvrdé y.\nPo měkkých ž, š, č, ř, c, j, ď, ť, ň se píše měkké i.\n\nProblém dělají jen obojetné: b, f, l, m, p, s, v, z.",f:"tvrdé:   h ch k r d t n → y\nměkké:   ž š č ř c j ď ť ň → i\nobojetné: b f l m p s v z → ?"},
  {h:"Jak se rozhodnout u obojetných",t:"Po obojetné souhlásce píšeme y jen ve vyjmenovaných slovech a ve slovech, která jsou od nich odvozená.\n\nVe všech ostatních případech se píše i. Když si nejsi jistá, zkus najít příbuzné vyjmenované slovo.",f:"bydlet → bydliště, obydlí (y)\nbít se → bitva (i)"},
  {h:"Vyjmenovaná po B a po L",t:"Po B: být, bydlit, obyvatel, byt, příbytek, nábytek, dobytek, obyčej, bystrý, bylina, kobyla, býk, Přibyslav.\n\nPo L: slyšet, mlýn, blýskat se, polykat, plynout, plýtvat, vzlykat, lysý, lýtko, lýko, lyže, pelyněk, plyš.",f:"B: být, bydlit, obyvatel, byt…\nL: slyšet, mlýn, blýskat, polykat…"},
  {h:"Vyjmenovaná po M a po P",t:"Po M: my, mýt, myslit, mýlit se, hmyz, myš, hlemýžď, mýtit, zamykat, smýkat, dmýchat, chmýří, nachomýtnout se, Litomyšl.\n\nPo P: pýcha, pytel, pysk, netopýr, slepýš, pyl, kopyto, klopýtat, třpytit se, zpytovat, pykat, pýr, pýřit se, čepýřit se.",f:"M: my, mýt, myslit, hmyz, myš…\nP: pýcha, pytel, netopýr, pyl…"},
  {h:"Vyjmenovaná po S, V a Z",t:"Po S: syn, sytý, sýr, syrový, sychravý, usychat, sýkora, sýček, sysel, syčet, sypat.\n\nPo V: vy, vysoký, výt, výskat, zvykat, žvýkat, vydra, výr, vyžle, povyk, výheň, cavyky, klavír.\n\nPo Z: brzy, jazyk, nazývat se, Ruzyně.",f:"S: syn, sytý, sýr, sýkora…\nV: vy, vysoký, vydra, výr…\nZ: brzy, jazyk, nazývat"},
  {h:"Dvojice, na kterých to stojí",t:"Některá slova zní stejně, ale znamenají něco jiného a píšou se jinak. Rozhoduje význam.\n\nTohle je přesně to, na co se test ptá — vždycky si přelož, co věta říká.",f:"být (existovat) × bít (tlouct)\nmýt (umývat) × mít (vlastnit)\nvýr (pták) × vír (ve vodě)\nsýra (jídlo) × síra (prvek)"},
  {h:"Další zrádné dvojice",t:"Zapamatuj si i tyhle. V testu se objevují pravidelně, protože obě varianty jsou správně — jen v jiné větě.",f:"my (osoby) × mi (mně)\nvy (osoby) × vi- (jinak)\nlýko (stromu) × liko (nic)\nnabýt (získat) × nabít (baterku)"},
  {h:"Odvozená slova",t:"Y se drží i ve slovech, která z vyjmenovaného vznikla — i když už vypadají jinak.\n\nProto zkoušej hledat příbuzné slovo. Když najdeš vyjmenované, píšeš y.",f:"myslit → myšlenka, smysl, úmysl\nbýt → bytost, bydliště, nábytek"}
 ],
 ulohy:[

{

 vyklad:[
  {h:"Mě a mně — pomůcka s tebou",t:"Nejspolehlivější trik: dosaď do věty místo mě/mně slovo TEBE nebo TOBĚ.\n\nSedí-li tebe, píšeš mě (obojí má dvě písmena). Sedí-li tobě, píšeš mně (obojí má tři).",f:"Vidíš mě? → Vidíš tebe? → mě\nDej mně to. → Dej tobě to. → mně"},
  {h:"Proč to tak funguje",t:"Mě je tvar 2. a 4. pádu — koho, čeho / koho, co. Odpovídá tvaru tebe.\n\nMně je tvar 3. a 6. pádu — komu, čemu / o kom, o čem. Odpovídá tvaru tobě.",f:"2. a 4. pád → mě (tebe)\n3. a 6. pád → mně (tobě)"},
  {h:"Mě uvnitř slova",t:"Uvnitř slov se rozhoduje jinak — podle toho, z čeho slovo vzniklo.\n\nJe-li v příbuzném slově n, píše se mně. Není-li tam, píše se mě.",f:"tamní → tamní místo → tamnější\njemný → jemnější (n → mn)\nrozumět → rozuměl (bez n → mě)"},
  {h:"Předpony s- a z- podle významu",t:"Předpona s- znamená pohyb dohromady, shora dolů nebo zmenšení.\n\nPředpona z- znamená změnu stavu nebo dokončení děje.",f:"s- : sejít se, sbalit, smazat, svázat\nz- : zmodrat, ztvrdnout, zlomit"},
  {h:"Dvojice, kde rozhoduje význam",t:"U některých slov jsou obě předpony správně — ale znamenají něco úplně jiného.\n\nTyhle dvojice se v testu objevují nejčastěji.",f:"sjet (dolů) × zjet (kam)\nsbít (spojit) × zbít (zmlátit)\nslézt (dolů) × zlézt (zdolat)\nsprávný × zprávy"},
  {h:"Předložky s a z",t:"Předložka s se pojí se 7. pádem — s kým, s čím. Znamená společně.\n\nPředložka z se pojí s 2. pádem — z koho, z čeho. Znamená odkud.",f:"s bratrem (7. pád, společně)\nz domu (2. pád, odkud)"},
  {h:"Zrádné případy u předložek",t:"Sejít se stolu znamená slézt z jeho povrchu — ale spisovně se říká ze stolu.\n\nPomůcka: můžeš-li se zeptat ODKUD, je to z. Můžeš-li se zeptat S KÝM nebo S ČÍM, je to s.",f:"spadl ze stolu (odkud)\npřišel s kamarádem (s kým)"},
  {h:"Předložka nebo předpona?",t:"Předložka stojí samostatně před slovem a dá se mezi ně vložit jiné slovo.\n\nPředpona je pevnou součástí slova a oddělit se nedá.",f:"s bratrem → s mým bratrem ✓ (předložka)\nsbalit → nelze rozdělit (předpona)"}
