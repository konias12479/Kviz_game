 id:"cj-slovnidruhy", predmet:"Čeština", ikona:"🔟",
 nazev:"Slovní druhy",
 popis:"Deset druhů, poznávací otázky a slova, která se snadno pletou. Základ pro skladbu i tvarosloví.",
 vyklad:[
  {h:"Deset slovních druhů",t:"1. podstatná jména, 2. přídavná jména, 3. zájmena, 4. číslovky, 5. slovesa, 6. příslovce, 7. předložky, 8. spojky, 9. částice, 10. citoslovce.\n\nPrvních pět se ohýbá (skloňuje nebo časuje), zbylých pět ne.",f:"ohebné: 1–5\nneohebné: 6–10"},
  {h:"Podstatná a přídavná jména",t:"Podstatné jméno pojmenovává osobu, zvíře, věc nebo vlastnost. Ptáš se KDO nebo CO.\n\nPřídavné jméno popisuje vlastnost. Ptáš se JAKÝ, KTERÝ, ČÍ.",f:"pes, radost, kámen → podstatné\nhodný, dřevěný, otcův → přídavné"},
  {h:"Zájmena a číslovky",t:"Zájmeno zastupuje jméno — místo Petr řekneš on.\n\nČíslovka vyjadřuje počet nebo pořadí. Ptáš se KOLIK nebo KOLIKÁTÝ.",f:"já, ty, on, ten, můj, kdo → zájmena\npět, druhý, mnoho, dvakrát → číslovky"},
  {h:"Slovesa",t:"Sloveso vyjadřuje děj nebo stav. Ptáš se CO DĚLÁ.\n\nPoznáš je snadno — dají se časovat a mají osobu, číslo a čas.",f:"běží, spal, bude psát, myslet"},
  {h:"Příslovce",t:"Příslovce určuje okolnost děje. Ptáš se KDE, KDY, JAK, PROČ.\n\nČasto se plete s přídavným jménem. Rozdíl: přídavné jméno patří ke jménu, příslovce ke slovesu.",f:"rychle běží (jak? příslovce)\nrychlý běh (jaký? přídavné)"},
  {h:"Předložky a spojky",t:"Předložka stojí před jménem a určuje jeho pád — na stole, do školy, s bratrem.\n\nSpojka spojuje slova nebo věty — a, ale, protože, když, že.",f:"předložky: v, na, do, pod, s, z\nspojky: a, i, ale, nebo, že, když"},
  {h:"Částice a citoslovce",t:"Částice uvozuje větu nebo vyjadřuje postoj — ať, kéž, snad, asi, prý.\n\nCitoslovce napodobuje zvuk nebo vyjadřuje cit — bum, haf, ach, jé.",f:"částice: ať, kéž, snad, asi, prý\ncitoslovce: bum, haf, au, ach"},
  {h:"Pozor na slova, která mění druh",t:"Stejné slovo může být podle věty různým slovním druhem. Vždycky se rozhoduj podle konkrétní věty, ne podle slova samotného.",f:"kolem domu (předložka)\nchodil kolem (příslovce)\njedna kniha (číslovka)\njedna z možností (zájmeno)"}
 ],
 ulohy:[
  {q:"Určete slovní druh slova RYCHLE ve větě:\n\nAuto jelo rychle.",typ:"choice",moz:["příslovce","přídavné jméno","podstatné jméno","sloveso"],spr:0,
   kroky:[{n:"Krok 1 — na co se ptáš",d:"Jelo JAK? Rychle. Ptáš se na okolnost děje.",f:"jak? → příslovce"},
    {n:"Krok 2 — ke kterému slovu patří",d:"Patří ke slovesu jelo, ne k podstatnému jménu. To potvrzuje příslovce.",f:"příslovce ✓"},
    {n:"Pro srovnání",d:"„Rychlé auto“ — tam je rychlé přídavné jméno, protože patří k autu.",f:"rychle = příslovce"}],
   vys:"Příslovce"},
  {q:"Určete slovní druh slova PĚT ve větě:\n\nKoupili jsme pět rohlíků.",typ:"choice",moz:["číslovka","podstatné jméno","zájmeno","příslovce"],spr:0,
   kroky:[{n:"Krok 1 — na co se ptáš",d:"Koupili KOLIK rohlíků? Pět.",f:"kolik? → číslovka"},
    {n:"Krok 2 — potvrzení",d:"Vyjadřuje počet, tedy číslovka základní.",f:"číslovka ✓"}],
   vys:"Číslovka"},
  {q:"Určete slovní druh slova POD ve větě:\n\nKočka spí pod stolem.",typ:"choice",moz:["předložka","příslovce","spojka","částice"],spr:0,
   kroky:[{n:"Krok 1 — kde slovo stojí",d:"Stojí před podstatným jménem stolem a určuje jeho pád.",f:"pod stolem (7. pád)"},
    {n:"Krok 2 — to je znak předložky",d:"Předložka se sama o sobě nedá použít, vždy patří ke jménu.",f:"předložka ✓"}],
   vys:"Předložka"},
  {q:"Určete slovní druh slova ALE ve větě:\n\nChtěl přijít, ale nestihl to.",typ:"choice",moz:["spojka","částice","citoslovce","příslovce"],spr:0,
   kroky:[{n:"Krok 1 — co slovo dělá",d:"Spojuje dvě věty do souvětí.",f:"spojuje věty"},
    {n:"Krok 2 — to je spojka",d:"Konkrétně spojka odporovací — druhá věta popírá očekávání z první.",f:"spojka ✓"}],
   vys:"Spojka"},
  {q:"Určete slovní druh slova KTERÝ ve větě:\n\nKniha, kterou jsem četl, byla dlouhá.",typ:"choice",moz:["zájmeno","přídavné jméno","spojka","částice"],spr:0,
   kroky:[{n:"Krok 1 — co slovo zastupuje",d:"Zastupuje podstatné jméno kniha, aby se neopakovalo.",f:"zastupuje jméno"},
    {n:"Krok 2 — to je zájmeno",d:"Konkrétně zájmeno vztažné — připojuje vedlejší větu.",f:"zájmeno ✓"},
    {n:"Pozor",d:"Přestože se ptáme „která kniha“, není to přídavné jméno — nepopisuje vlastnost, jen odkazuje.",f:"zájmeno vztažné"}],
   vys:"Zájmeno"},
  {q:"Určete slovní druh slova AŤ ve větě:\n\nAť už konečně přijde!",typ:"choice",moz:["částice","spojka","citoslovce","příslovce"],spr:0,
   kroky:[{n:"Krok 1 — co slovo dělá",d:"Nic nespojuje, jen uvozuje větu a vyjadřuje přání mluvčího.",f:"vyjadřuje přání"},
    {n:"Krok 2 — to je částice",d:"Částice uvozují věty a vyjadřují postoj — ať, kéž, nechť, snad.",f:"částice ✓"},
    {n:"Pozor na dvojí roli",d:"Ve větě „Řekl, ať přijde“ je ať naopak spojka — připojuje vedlejší větu.",f:"tady částice"}],
   vys:"Částice"},
  {q:"Kolik slovních druhů rozlišujeme v češtině?",typ:"open",odp:"10",
   kroky:[{n:"Krok 1 — vyjmenuj je",d:"Podstatná jména, přídavná jména, zájmena, číslovky, slovesa, příslovce, předložky, spojky, částice, citoslovce.",f:"1–10"},
    {n:"Krok 2 — spočítej",d:"Prvních pět se ohýbá, zbylých pět ne.",f:"10 slovních druhů"}],
   vys:"10"},
  {q:"Určete slovní druh slova KOLEM ve větě:\n\nProšel kolem domu.",typ:"choice",moz:["předložka","příslovce","podstatné jméno","spojka"],spr:0,
   kroky:[{n:"Krok 1 — stojí před jménem?",d:"Ano — kolem DOMU. Určuje pád podstatného jména.",f:"kolem domu (2. pád)"},
    {n:"Krok 2 — to je předložka",d:"",f:"předložka ✓"},
    {n:"Pozor na druhý význam",d:"Ve větě „Prošel kolem“ (bez jména za tím) je kolem příslovce místa.",f:"tady předložka"}],
   vys:"Předložka"},
  {q:"Které slovo ve větě je sloveso?\n\nMalý chlapec rychle přeběhl ulici.",typ:"choice",moz:["přeběhl","malý","rychle","ulici"],spr:0,
   kroky:[{n:"Krok 1 — hledej děj",d:"Co chlapec dělal? Přeběhl.",f:"co dělal? → sloveso"},
    {n:"Krok 2 — projdi ostatní",d:"Malý je přídavné jméno, rychle příslovce, ulici podstatné jméno.",f:"přeběhl ✓"}],
   vys:"přeběhl"},
  {q:"Určete slovní druh slova DVAKRÁT.",typ:"choice",moz:["číslovka","příslovce","zájmeno","částice"],spr:0,
   kroky:[{n:"Krok 1 — na co se ptáš",d:"Kolikrát? Dvakrát.",f:"kolikrát? → číslovka"},
    {n:"Krok 2 — jaký druh číslovky",d:"Je to číslovka násobná. Vyjadřuje, kolikrát se něco stalo.",f:"číslovka násobná ✓"},
    {n:"Proč ne příslovce",d:"Vypadá jako příslovce, ale odpovídá na otázku po počtu, což je znak číslovky.",f:"číslovka"}],
   vys:"Číslovka (násobná)"}
 ]
},
{
 id:"cj-tvaroslovi", predmet:"Čeština", ikona:"🧩",
 nazev:"Tvarosloví — pády, vzory a slovesa",
 popis:"Sedm pádů, vzory podstatných jmen, osoba a čas u sloves. Testové otázky bývají přesně na tohle.",
 vyklad:[
  {h:"Sedm pádů a jejich otázky",t:"1. kdo, co · 2. koho, čeho · 3. komu, čemu · 4. koho, co · 5. oslovujeme, voláme · 6. o kom, o čem · 7. s kým, s čím\n\nOtázky se vyplatí umět odříkat. Bez nich pád neurčíš.",f:"1. kdo, co\n2. koho, čeho\n3. komu, čemu\n4. koho, co\n5. oslovení\n6. o kom, o čem\n7. s kým, s čím"},
  {h:"Jak pád určit",t:"Najdi si slovo ve větě a polož si na něj otázku. Ta otázka ti pád prozradí.\n\nPozor na 2. a 4. pád — u neživotných se tvary často shodují. Pomůže dosadit životné slovo.",f:"Vidím psa. → koho vidím? → 4. pád\nBojím se psa. → koho se bojím? → 2. pád"},
  {h:"Rod a vzory podstatných jmen",t:"Rod mužský životný: pán, muž, předseda, soudce.\nRod mužský neživotný: hrad, stroj.\nRod ženský: žena, růže, píseň, kost.\nRod střední: město, moře, kuře, stavení.",f:"M živ: pán, muž, předseda, soudce\nM neživ: hrad, stroj\nŽ: žena, růže, píseň, kost\nS: město, moře, kuře, stavení"},
  {h:"Jak najít vzor",t:"Dej slovo do 1. pádu jednotného čísla, urči rod a pak porovnej koncovku ve 2. pádu.\n\nPráve 2. pád rozliší podobné vzory nejlépe.",f:"kost — 2. pád kosti\npíseň — 2. pád písně"},
  {h:"Osoba, číslo a čas u sloves",t:"Osoby jsou tři a každá má jednotné i množné číslo.\n\nČasy jsou minulý, přítomný a budoucí. U dokonavých sloves přítomný čas neexistuje.",f:"1. os. já píšu / my píšeme\n2. os. ty píšeš / vy píšete\n3. os. on píše / oni píšou"},
  {h:"Slovesný způsob",t:"Oznamovací říká, co se děje. Rozkazovací přikazuje. Podmiňovací vyjadřuje podmínku nebo přání a poznáš ho podle by.",f:"oznamovací: přijde\nrozkazovací: přijď\npodmiňovací: přišel by"},
  {h:"Vid dokonavý a nedokonavý",t:"Dokonavé sloveso vyjadřuje děj ukončený a nemá přítomný čas — napsal, napíšu (to je budoucnost).\n\nNedokonavé vyjadřuje děj probíhající — psal, píšu, budu psát.",f:"psát (nedok.) → píšu, budu psát\nnapsat (dok.) → napíšu (budoucí!)"},
  {h:"Nejčastější past v testu",t:"Otázka „v jakém čase je sloveso napíšu“ svádí odpovědět přítomný. Je ale budoucí, protože sloveso je dokonavé.\n\nZkus si to: „Napíšu to zítra“ — dneska to ještě není hotové.",f:"napíšu = čas BUDOUCÍ"}
 ],
 ulohy:[
  {q:"Urči pád podtrženého slova:\n\nDal jsem to KAMARÁDOVI.",typ:"choice",moz:["3. pád","2. pád","4. pád","6. pád"],spr:0,
   kroky:[{n:"Krok 1 — polož otázku",d:"Dal jsem to komu? Kamarádovi.",f:"komu? čemu?"},
    {n:"Krok 2 — najdi pád k otázce",d:"Komu, čemu je 3. pád.",f:"3. pád ✓"}],
   vys:"3. pád"},
  {q:"Urči pád podtrženého slova:\n\nBojím se TMY.",typ:"choice",moz:["2. pád","4. pád","3. pád","7. pád"],spr:0,
   kroky:[{n:"Krok 1 — polož otázku",d:"Bojím se koho, čeho? Tmy.",f:"koho? čeho?"},
    {n:"Krok 2 — pád",d:"Koho, čeho je 2. pád.",f:"2. pád ✓"},
    {n:"Pomůcka",d:"Sloveso bát se se vždycky pojí s 2. pádem.",f:"2. pád"}],
   vys:"2. pád"},
  {q:"Urči pád podtrženého slova:\n\nMluvili jsme o VÝLETĚ.",typ:"choice",moz:["6. pád","2. pád","3. pád","7. pád"],spr:0,
   kroky:[{n:"Krok 1 — polož otázku",d:"Mluvili jsme o kom, o čem? O výletě.",f:"o kom? o čem?"},
    {n:"Krok 2 — pád",d:"To je 6. pád. Poznáš ho i podle toho, že se vždy pojí s předložkou.",f:"6. pád ✓"}],
   vys:"6. pád"},
  {q:"Podle kterého vzoru se skloňuje slovo KOST?",typ:"choice",moz:["kost","píseň","žena","růže"],spr:0,
   kroky:[{n:"Krok 1 — urči rod",d:"Ta kost — rod ženský.",f:"rod ženský"},
    {n:"Krok 2 — porovnej 2. pád",d:"Bez kosti. Vzor kost má ve 2. pádě koncovku -i.",f:"kosti → vzor kost ✓"},
    {n:"Pro srovnání",d:"Vzor píseň má ve 2. pádě písně, tedy -e. To je rozlišovací znak.",f:"kost"}],
   vys:"Vzor kost"},
  {q:"Podle kterého vzoru se skloňuje slovo MOŘE?",typ:"choice",moz:["moře","město","kuře","stavení"],spr:0,
   kroky:[{n:"Krok 1 — urči rod",d:"To moře — rod střední.",f:"rod střední"},
    {n:"Krok 2 — vzory středního rodu",d:"Město, moře, kuře, stavení. Slovo moře je samo vzorem.",f:"vzor moře ✓"}],
   vys:"Vzor moře"},
  {q:"V jaké osobě a čísle je sloveso ve větě:\n\nPůjdeme do kina.",typ:"choice",moz:["1. osoba, množné číslo","1. osoba, jednotné číslo","3. osoba, množné číslo","2. osoba, množné číslo"],spr:0,
   kroky:[{n:"Krok 1 — kdo to dělá",d:"Kdo půjde? My. To je 1. osoba.",f:"my → 1. osoba"},
    {n:"Krok 2 — kolik jich je",d:"My znamená víc lidí, tedy množné číslo.",f:"1. osoba, množné číslo ✓"}],
   vys:"1. osoba, množné číslo"},
  {q:"V jakém čase je sloveso NAPÍŠU?",typ:"choice",moz:["budoucí","přítomný","minulý","podmiňovací"],spr:0,
   kroky:[{n:"Krok 1 — je sloveso dokonavé?",d:"Napsat vyjadřuje ukončený děj, je tedy dokonavé.",f:"dokonavé sloveso"},
    {n:"Krok 2 — co to znamená pro čas",d:"Dokonavá slovesa nemají přítomný čas. Tvar, který vypadá jako přítomný, je ve skutečnosti budoucí.",f:"napíšu = budoucí ✓"},
    {n:"Ověř si to větou",d:"„Napíšu to zítra.“ Zítra je budoucnost. Sedí.",f:"čas budoucí"}],
   vys:"Čas budoucí"},
  {q:"Ve kterém slovesném způsobu je tvar PŘIŠEL BY?",typ:"choice",moz:["podmiňovací","oznamovací","rozkazovací","trpný"],spr:0,
   kroky:[{n:"Krok 1 — najdi poznávací znak",d:"Ve tvaru je slůvko by. To je jasná známka podmiňovacího způsobu.",f:"by → podmiňovací"},
    {n:"Krok 2 — co to znamená",d:"Vyjadřuje děj, který by nastal za nějaké podmínky. „Přišel by, kdyby měl čas.“",f:"podmiňovací ✓"}],
   vys:"Podmiňovací způsob"},
  {q:"Urči pád: \n\nS BRATREM jsme šli na výlet.",typ:"choice",moz:["7. pád","4. pád","6. pád","2. pád"],spr:0,
   kroky:[{n:"Krok 1 — polož otázku",d:"Šli jsme s kým, s čím? S bratrem.",f:"s kým? s čím?"},
    {n:"Krok 2 — pád",d:"To je 7. pád. Předložka s se s ním pojí vždycky.",f:"7. pád ✓"}],
   vys:"7. pád"},
  {q:"Podle kterého vzoru se skloňuje slovo PŘEDSEDA?",typ:"choice",moz:["předseda","pán","muž","soudce"],spr:0,
   kroky:[{n:"Krok 1 — urči rod",d:"Ten předseda — mužský rod životný. Přestože slovo končí na -a jako ženská jména.",f:"mužský životný"},
    {n:"Krok 2 — vzory mužského životného",d:"Pán, muž, předseda, soudce. Slovo předseda je samo vzorem pro jména zakončená na -a.",f:"vzor předseda ✓"},
    {n:"Podobná slova",d:"Také starosta, kolega, husita — všechna podle vzoru předseda.",f:"předseda"}],
   vys:"Vzor předseda"}
 ]
},
{
 id:"cj-skladba", predmet:"Čeština", ikona:"🌳",
 nazev:"Větné členy a skladba",
 popis:"Podmět, přísudek, předmět, přívlastek a příslovečné určení. Základní stavba věty.",
 vyklad:[
  {h:"Základní skladební dvojice",t:"Každá věta stojí na dvojici podmět a přísudek. To je její kostra.\n\nPodmět říká, KDO nebo CO. Přísudek říká, CO DĚLÁ nebo JAKÝ JE.",f:"Pes | štěká.\npodmět | přísudek"},
  {h:"Podmět a jeho druhy",t:"Vyjádřený podmět je ve větě napsaný. Nevyjádřený se pozná z tvaru slovesa.\n\nNěkolikanásobný podmět má víc částí spojených spojkou.",f:"Petr přišel. (vyjádřený)\nPřišel pozdě. (nevyjádřený — on)\nPetr a Jana přišli. (několikanásobný)"},
  {h:"Přísudek slovesný a jmenný",t:"Slovesný přísudek je tvořený jen slovesem — běží, spal, bude psát.\n\nJmenný se sponou je spojení slovesa být, bývat, stát se a jména — je hodný, stal se lékařem.",f:"Chlapec běží. (slovesný)\nChlapec je hodný. (jmenný se sponou)"},
  {h:"Předmět",t:"Předmět doplňuje sloveso. Ptáš se na něj pádovými otázkami kromě 1. a 5. pádu.\n\nČasto je to ten, na koho děj směřuje.",f:"Čtu knihu. (co čtu?)\nPomohl bratrovi. (komu?)"},
  {h:"Přívlastek",t:"Přívlastek rozvíjí podstatné jméno. Ptáš se JAKÝ, KTERÝ, ČÍ.\n\nShodný stojí většinou před jménem a shoduje se s ním v pádě. Neshodný stojí za ním a neshoduje se.",f:"nový dům (shodný)\ndům mého otce (neshodný)"},
  {h:"Příslovečné určení",t:"Rozvíjí sloveso a určuje okolnost. Ptáš se KDE, KDY, JAK, PROČ.\n\nPodle otázky rozlišujeme určení místa, času, způsobu a příčiny.",f:"Šel domů. (kam? místa)\nPřišel včera. (kdy? času)\nBěžel rychle. (jak? způsobu)"},
  {h:"Jak rozebírat větu",t:"Postupuj vždy stejně. Najdi přísudek — je to nejjistější orientační bod, protože je v každé větě.\n\nPak se na něj zeptej KDO nebo CO a máš podmět. Ostatní členy dohledáš otázkami.",f:"1. přísudek (co se děje)\n2. podmět (kdo/co)\n3. ostatní členy otázkami"},
  {h:"Nejčastější past",t:"Podmět nemusí stát na začátku věty a nemusí být hned u slovesa.\n\nProto se vždycky ptej, ne hádej podle pořadí slov.",f:"Na zahradě si děti hrály.\npodmět = děti, ne zahrada"}
 ],
 ulohy:[
  {q:"Urči podmět ve větě:\n\nNa louce kvetly bílé sedmikrásky.",typ:"choice",moz:["sedmikrásky","louce","bílé","kvetly"],spr:0,
   kroky:[{n:"Krok 1 — najdi přísudek",d:"Co se ve větě děje? Kvetly.",f:"přísudek: kvetly"},

{
 id:"cj-carky", predmet:"Čeština", ikona:"➰",
 nazev:"Souvětí a čárky",
 popis:"Kdy se píše čárka a kdy ne. Věta hlavní a vedlejší, spojky, oslovení a vsuvky.",
 vyklad:[
  {h:"Věta jednoduchá a souvětí",t:"Věta jednoduchá má jeden přísudek. Souvětí má přísudků víc — tolik vět, kolik je sloves v určitém tvaru.\n\nPočet přísudků je nejjistější způsob, jak větu od souvětí odlišit.",f:"Petr čte knihu. (1 přísudek)\nPetr čte, když má čas. (2 přísudky)"},
  {h:"Základní pravidlo",t:"Mezi větami v souvětí se zpravidla píše čárka.\n\nVýjimka je, když jsou věty spojené spojkami a, i, ani, nebo, či ve významu prostého slučování.",f:"Přišel a posadil se. (bez čárky)\nPřišel, ale nezůstal. (s čárkou)"},
  {h:"Před kterými spojkami se čárka píše vždy",t:"Ale, avšak, však, nýbrž, protože, poněvadž, jelikož, aby, že, když, kdyby, přestože, ačkoli, jestliže.\n\nTyhle spojky uvozují vedlejší větu nebo odporují — čárka před nimi patří.",f:"ale, však, protože, aby,\nže, když, přestože, ačkoli"},
  {h:"Kdy se před A čárka přece píše",t:"Spojka a obvykle čárku nemá. Ale je-li ve významu odporovacím nebo následuje-li po ní jiná spojka, čárka tam patří.",f:"Chtěl přijít, a nepřišel. (odporovací)\nŘekl, že přijde, a že se těší.\nPršelo, a proto jsme zůstali doma."},
  {h:"Vedlejší věta uvnitř",t:"Je-li vedlejší věta vložená doprostřed, odděluje se čárkami z OBOU stran.\n\nZapomenutá druhá čárka je jedna z nejčastějších chyb vůbec.",f:"Kniha, kterou jsem četl, byla dlouhá.\n         ↑ obě čárky ↑"},
  {h:"Oslovení a citoslovce",t:"Oslovení se vždycky odděluje čárkou. Stojí-li uprostřed věty, čárkami z obou stran.\n\nStejně tak citoslovce.",f:"Petře, pojď sem.\nPojď sem, Petře.\nUž, Petře, běž."},
  {h:"Vsuvka a přístavek",t:"Vsuvka je poznámka vložená do věty. Odděluje se čárkami z obou stran.\n\nPřístavek je jiné pojmenování téhož a odděluje se také.",f:"Zítra, myslím, bude pršet.\nKarel IV., český král, založil univerzitu."},
  {h:"Několikanásobné větné členy",t:"Ve výčtu se čárky píší mezi jednotlivými položkami — kromě té, před kterou je spojka a, i, nebo.",f:"Koupil chleba, máslo, sýr a mléko.\n(před posledním a je čárka zbytečná)"}
 ],
 ulohy:[

{
 id:"cj-slovotvorba", predmet:"Čeština", ikona:"🧱",
 nazev:"Stavba slova a slovotvorba",
 popis:"Kořen, předpona, přípona a koncovka. Jak slova vznikají a jak najít slova příbuzná.",
 vyklad:[
  {h:"Části slova",t:"Kořen nese základní význam a je společný všem příbuzným slovům.\n\nPředpona stojí před kořenem, přípona za ním, koncovka je úplně na konci a mění se při ohýbání.",f:"na-  -uč-  -itel-  -é\npředpona kořen přípona koncovka"},
  {h:"Jak najít kořen",t:"Vypiš si několik příbuzných slov pod sebe a najdi část, kterou mají všechna společnou.\n\nPozor — v kořeni se může střídat hláska. Uč / ouč / úč je pořád jeden kořen.",f:"učit, učitel, naučit, výuka\nkořen: uč- / úk-"},
  {h:"Slova příbuzná",t:"Příbuzná slova mají stejný kořen A souvisejí i významem.\n\nSamotná podobnost nestačí. Voda a vodit vypadají podobně, ale významem spolu nesouvisí — příbuzná nejsou.",f:"voda, vodní, vodník ✓\nvoda × vodit ✗"},
  {h:"Odvozování",t:"Nejčastější způsob tvoření slov. Ke kořeni se přidá předpona, přípona nebo obojí.\n\nTím vznikne nové slovo s posunutým významem.",f:"les → lesník, lesní, prales\nučit → naučit, učitel, výuka"},
  {h:"Skládání",t:"Dvě slova se spojí do jednoho, obvykle spojovací samohláskou.\n\nVýsledek nese význam obou částí.",f:"velkoměsto (velké město)\nzeměpis (psát o zemi)\nvodovod, teploměr"},
  {h:"Zkracování",t:"Ze začátečních písmen nebo slabik vznikne zkratka nebo zkratkové slovo.\n\nZkratkové slovo se dá skloňovat jako běžné podstatné jméno.",f:"ČR, ZŠ, atd. (zkratky)\nČedok, Sazka (zkratková slova)"},
  {h:"Předpona nebo předložka?",t:"Předpona je pevnou součástí slova a nedá se oddělit. Předložka stojí samostatně.\n\nZkouška: dá se mezi ně vložit další slovo? Pak je to předložka.",f:"nadchodit (předpona)\nnad chodníkem → nad širokým chodníkem (předložka)"},
  {h:"K čemu je to dobré",t:"Znalost stavby slova ti pomůže s pravopisem. Když víš, že se slovo skládá z předpony a kořene, poznáš, kde se zdvojuje souhláska.",f:"bez-  +  zubý  →  bezzubý\nroz-  +  zlobit  →  rozzlobit"}
 ],
 ulohy:[
  {q:"Urči kořen slova:\n\nPŘEDŠKOLNÍ",typ:"choice",moz:["škol","před","ní","předškol"],spr:0,
   kroky:[{n:"Krok 1 — najdi příbuzná slova",d:"Škola, školní, školák, předškolní.",f:"škola, školák, školní"},
    {n:"Krok 2 — co mají společné",d:"Část škol-.",f:"kořen: škol- ✓"},
    {n:"Krok 3 — rozeber celé slovo",d:"Před- je předpona, -n- přípona, -í koncovka.",f:"před-škol-n-í"}],
   vys:"škol-"},
  {q:"Urči předponu ve slově:\n\nNEJKRÁSNĚJŠÍ",typ:"choice",moz:["nej-","ne-","nejkrás-","krás-"],spr:0,
   kroky:[{n:"Krok 1 — základ slova",d:"Krásný, krásnější, nejkrásnější.",f:"kořen: krás-"},
    {n:"Krok 2 — co stojí před kořenem",d:"Předpona nej- tvoří třetí stupeň přídavných jmen.",f:"nej- ✓"},
    {n:"Pozor",d:"Není to ne-, které by znamenalo zápor. Nej- je stupňovací.",f:"nej-krás-něj-ší"}],
   vys:"nej-"},
  {q:"Které slovo NENÍ příbuzné se slovem VODA?",typ:"choice",moz:["vodit","vodní","vodník","povodeň"],spr:0,
   kroky:[{n:"Krok 1 — projdi významy",d:"Vodní, vodník a povodeň souvisejí s vodou jako tekutinou.",f:"souvisí s vodou ✓"},
    {n:"Krok 2 — a vodit?",d:"Vodit znamená vést někoho za ruku. S vodou to nemá nic společného, jen to podobně zní.",f:"vodit ✗"},
    {n:"Zapamatuj si",d:"K příbuznosti nestačí podobný zvuk — musí souhlasit i význam.",f:"vodit není příbuzné"}],
   vys:"vodit"},
  {q:"Jak vzniklo slovo ZEMĚPIS?",typ:"choice",moz:["skládáním","odvozováním","zkracováním","přejetím z cizího jazyka"],spr:0,

{
 id:"cj-vyznam", predmet:"Čeština", ikona:"💭",

 vyklad:[

  {h:"Antonyma",t:"Slova opačného významu. Často se tvoří předponou ne-, ale ne vždycky.",f:"velký × malý\nden × noc\nšťastný × nešťastný"},
  {h:"Homonyma",t:"Slova, která zní i píší se stejně, ale znamenají něco úplně jiného.\n\nVýznam pozná jen z kontextu — z toho, jak je slovo použito ve větě.",f:"kolej (na koleji × studentská)\nlist (na stromě × papíru)\nvlna (na moři × ovčí)"},
  {h:"Slova jednoznačná a mnohoznačná",t:"Jednoznačné slovo má jediný význam — obvykle odborné termíny.\n\nMnohoznačné má významů víc, které spolu ale souvisejí.",f:"kyslík (jednoznačné)\noko (na obličeji, na polévce, na síti)"},
  {h:"Význam přímý a přenesený",t:"Přímý význam je ten původní a doslovný. Přenesený vznikl na základě podobnosti.\n\nPřenesené významy dávají jazyku barvu — a v testu se na ně ptají.",f:"zlaté hodinky (přímý)\nzlaté ruce (přenesený)"},
  {h:"Metafora a metonymie",t:"Metafora přenáší význam podle podobnosti — hlava člověka a hlava státu.\n\nMetonymie podle věcné souvislosti — číst Čapka znamená číst jeho knihu.",f:"metafora: moře slz, kamenné srdce\nmetonymie: pije sklenici, čte Nerudu"},
  {h:"Rčení a přísloví",t:"Rčení je ustálené obrazné spojení, které se ohýbá podle věty — chodit kolem horké kaše.\n\nPřísloví je celá věta s poučením — Kdo šetří, má za tři.",f:"rčení: mít máslo na hlavě\npřísloví: Bez práce nejsou koláče."},
  {h:"Slova citově zabarvená",t:"Zdrobněliny vyjadřují náklonnost, zveličelá slova naopak.\n\nHanlivá slova vyjadřují odpor. Neutrální slovo je bez zabarvení.",f:"pes (neutrální)\npejsek (zdrobnělina)\npsisko (zveličelé)"}
 ],

    {n:"Krok 2 — projdi možnosti",d:"Dlouhý a vysoký jsou jiné rozměry, ne opaky. Opakem širokého je úzký.",f:"úzký ✓"}],

    {n:"Krok 3 — proč právě kolej",d:"Železniční kolej a studentská kolej spolu nemají nic společného.",f:"homonyma"}],

  {q:"V jakém významu je použito slovo ZLATÉ ve spojení ZLATÉ RUCE?",typ:"choice",moz:["přeneseném","přímém","zdrobnělém","hanlivém"],spr:0,

 ]

{
 id:"cj-text", predmet:"Čeština", ikona:"📖",
 nazev:"Práce s textem",
 popis:"Čtenářská gramotnost — hlavní myšlenka, informace v textu, styl a záměr autora. Největší část testu.",
 vyklad:[
  {h:"Proč je tenhle okruh nejdůležitější",t:"Test z češtiny ověřuje hlavně čtenářskou gramotnost. Otázek k výchozím textům bývá víc než na pravopis.\n\nDobrá zpráva: odpověď je skoro vždycky přímo v textu. Nemusíš nic vědět předem.",f:"odpověď hledej V TEXTU"},
  {h:"Nejdřív si přečti otázku",t:"Než začneš číst dlouhý text, projdi si otázky. Budeš vědět, co v textu hledat, a nebudeš ho číst nadarmo dvakrát.",f:"1. otázky\n2. text\n3. odpovědi"},
  {h:"Hlavní myšlenka",t:"Ptej se: o čem to celé je? Co by zůstalo, kdybych to měla shrnout jednou větou?\n\nHlavní myšlenka bývá v úvodu nebo v závěru odstavce. Detaily a příklady hlavní myšlenkou nejsou.",f:"O čem to je jako celek?"},
  {h:"Rozliš fakt od názoru",t:"Fakt se dá ověřit — je to tvrzení o skutečnosti.\n\nNázor vyjadřuje postoj a poznáš ho podle slov jako myslím, podle mě, nejlepší, krásný.",f:"fakt: Praha má 1,3 milionu obyvatel.\nnázor: Praha je nejkrásnější město."},
  {h:"Co text NEŘÍKÁ",t:"Častá otázka zní, které tvrzení z textu nevyplývá. Pozor na možnosti, které znějí rozumně a pravdivě — ale v textu nejsou.\n\nRozhoduje jen text, ne to, co víš odjinud.",f:"Je to v textu? Ne? → nevyplývá."},
  {h:"Funkční styly",t:"Prostěsdělovací — běžná komunikace, dopis, vzkaz.\nOdborný — učebnice, encyklopedie, přesné termíny.\nPublicistický — noviny, zpravodajství.\nUmělecký — próza a poezie, obrazná vyjádření.\nAdministrativní — úřední dopisy, formuláře.",f:"prostěsdělovací, odborný,\npublicistický, umělecký,\nadministrativní"},
  {h:"Jak styl poznat",t:"Podívej se na slovní zásobu a účel. Odborný text má termíny a poučuje. Umělecký má obrazná vyjádření a působí na city. Publicistický informuje o aktuálním dění.",f:"termíny → odborný\nobrazy a city → umělecký\naktuality → publicistický"},
  {h:"Slohové postupy",t:"Vyprávěcí — děj v čase, co se stalo.\nPopisný — jak něco vypadá.\nVýkladový — jak něco funguje a proč.\nÚvahový — přemýšlení nad problémem.",f:"vyprávěcí, popisný,\nvýkladový, úvahový"}
 ],
 ulohy:[
  {q:"VÝCHOZÍ TEXT\n\nJežek západní je noční savec. Přes den spí ve svém úkrytu a ven vychází až po setmění. Živí se hlavně hmyzem, plži a žížalami. Na zimu upadá do pravého zimního spánku, který trvá od listopadu do března.\n\nCo je hlavním obsahem textu?",typ:"choice",
   moz:["Základní informace o způsobu života ježka","Ochrana ježků v zahradách","Porovnání ježka s jinými savci","Vyprávění o setkání s ježkem"],spr:0,
   kroky:[{n:"Krok 1 — projdi text po větách",d:"Kdy je aktivní, čím se živí, jak přezimuje.",f:"aktivita, potrava, zimní spánek"},
    {n:"Krok 2 — co mají společné",d:"Všechno popisuje, jak ježek žije.",f:"způsob života ✓"},
    {n:"Krok 3 — vyluč ostatní",d:"O ochraně, porovnávání ani o žádném zážitku text nemluví.",f:"informace o způsobu života"}],
   vys:"Základní informace o způsobu života ježka"},
  {q:"VÝCHOZÍ TEXT (viz předchozí úloha o ježkovi)\n\nKteré tvrzení z textu NEVYPLÝVÁ?",typ:"choice",
   moz:["Ježek je v Česku chráněný živočich","Ježek je aktivní v noci","Ježek se živí hmyzem","Zimní spánek ježka trvá zhruba pět měsíců"],spr:0,
   kroky:[{n:"Krok 1 — ověř každou možnost v textu",d:"Noční aktivita — v textu je. Hmyz — v textu je. Listopad až březen je pět měsíců — vyplývá.",f:"tři možnosti v textu jsou"},
    {n:"Krok 2 — zbývá ochrana",d:"O tom, že je ježek chráněný, text neříká ani slovo.",f:"nevyplývá ✓"},
    {n:"Pozor na past",d:"To tvrzení je pravdivé — ježek chráněný opravdu je. Ale otázka se ptá na text, ne na skutečnost.",f:"rozhoduje jen text"}],
   vys:"Ježek je v Česku chráněný živočich"},
  {q:"Které z tvrzení je NÁZOR, nikoli fakt?",typ:"choice",
   moz:["Zima je nejhezčí roční období.","Zima trvá tři měsíce.","V zimě klesají teploty pod nulu.","Nejkratší den v roce připadá na prosinec."],spr:0,
   kroky:[{n:"Krok 1 — dá se to ověřit?",d:"Délku zimy, teploty i datum slunovratu lze ověřit měřením.",f:"ověřitelné = fakta"},
    {n:"Krok 2 — a co nejhezčí?",d:"Slovo nejhezčí vyjadřuje osobní postoj. Někdo má radši léto.",f:"názor ✓"},
    {n:"Pomůcka",d:"Hodnotící slova jako nejlepší, krásný, nudný obvykle prozradí názor.",f:"Zima je nejhezčí roční období."}],
   vys:"Zima je nejhezčí roční období."},
  {q:"Do kterého funkčního stylu patří tento text?\n\n„Vážená paní ředitelko, žádám Vás o uvolnění své dcery z výuky dne 15. května z rodinných důvodů.“",typ:"choice",
   moz:["administrativní","umělecký","publicistický","prostěsdělovací"],spr:0,
   kroky:[{n:"Krok 1 — k čemu text slouží",d:"Je to úřední žádost adresovaná instituci.",f:"úřední účel"},
    {n:"Krok 2 — jak je napsaný",d:"Ustálené obraty, vykání s velkým V, věcnost, žádné city ani obrazy.",f:"formální jazyk"},
    {n:"Krok 3 — to je styl administrativní",d:"Patří sem žádosti, přihlášky, formuláře, potvrzení.",f:"administrativní ✓"}],
   vys:"Administrativní styl"},
  {q:"Do kterého funkčního stylu patří text?\n\n„Slunce zapadalo za obzor a proměnilo oblohu v moře rudého plamene. Ticho večera dolehlo na kraj jako těžká přikrývka.“",typ:"choice",
   moz:["umělecký","odborný","administrativní","publicistický"],spr:0,
   kroky:[{n:"Krok 1 — všimni si vyjadřování",d:"Moře rudého plamene, ticho jako těžká přikrývka — to jsou obrazná pojmenování.",f:"metafory a přirovnání"},
    {n:"Krok 2 — jaký má text účel",d:"Nechce poučit ani informovat, chce působit na city a vytvořit náladu.",f:"působí na city"},
    {n:"Krok 3 — to je styl umělecký",d:"",f:"umělecký ✓"}],
   vys:"Umělecký styl"},
  {q:"Který slohový postup je v textu?\n\n„Nejprve smícháme mouku s cukrem. Poté přidáme vejce a vše důkladně promícháme. Nakonec vlijeme těsto do formy.“",typ:"choice",
   moz:["popisný (návod)","vyprávěcí","úvahový","výkladový"],spr:0,
   kroky:[{n:"Krok 1 — co text dělá",d:"Popisuje po krocích, jak něco udělat.",f:"nejprve, poté, nakonec"},
    {n:"Krok 2 — to je popis pracovního postupu",d:"Patří pod popisný slohový postup.",f:"popisný ✓"},
    {n:"Proč ne vyprávěcí",d:"Vyprávění by mělo děj a postavy — něco by se přihodilo. Tady jde o návod.",f:"popisný (návod)"}],
   vys:"Popisný (návod)"},
  {q:"VÝCHOZÍ TEXT\n\nKnihovna bude od 1. do 14. července uzavřena z důvodu revize knižního fondu. Čtenáři si mohou knihy vypůjčit nejpozději 30. června. Vrácení knih se během uzavření nepočítá do výpůjční lhůty.\n\nDo kdy si lze knihy vypůjčit?",typ:"choice",

/* ================= STAV ================= */
const $=id=>document.getElementById(id);
let S={done:{},ok:0,total:0};
try{const s=localStorage.getItem("verunka_save");if(s)S=JSON.parse(s);}catch(e){}
function save(){try{localStorage.setItem("verunka_save",JSON.stringify(S))}catch(e){}}
let O=null,ui=0,vi=0,ki=0,odpovezeno=false;
// každý příklad na vlastní řádek s odsazením, ať se navzájem nelepí
function radky(s){
  return String(s).split(/\n/).map(function(l){
    return l.trim()===""?'<div class="fmez"></div>':'<div class="fl">'+l+'</div>';
  }).join("");
}
if(S.rychly===undefined)S.rychly=false;
function toggleRychly(){S.rychly=!S.rychly;save();kresliSpeed();if(!odpovezeno)renderUloha();}
function kresliSpeed(){
  const b=$("ulSpeed");if(!b)return;
  b.classList.toggle("on",!!S.rychly);
  b.textContent=S.rychly
    ?"⏩ Rychlý režim: ZAPNUTÝ — správná odpověď rovnou přeskočí na další úlohu"
    :"⏩ Rychlý režim: vypnutý — umíš to? Klepni a zrychli si to";
}

function go(n){document.querySelectorAll(".screen").forEach(x=>x.classList.remove("on"));$("s-"+n).classList.add("on");window.scrollTo(0,0);}

/* ================= MENU ================= */
function renderMenu(){
  const dny=Math.max(0,Math.ceil((ZKOUSKA-new Date())/86400000));
  $("stDays").textContent=dny;
  $("stDone").textContent=S.total||0;
  $("stOk").textContent=(S.total?Math.round(100*S.ok/S.total):0)+" %";
  let h="";
  const predmety=[];
  DATA.forEach(o=>{if(!predmety.includes(o.predmet))predmety.push(o.predmet)});
  predmety.forEach(p=>{
    const sk=DATA.map((o,i)=>({o,i})).filter(x=>x.o.predmet===p);
    const hot=sk.reduce((a,x)=>a+(S.done[x.o.id]||[]).length,0);
    const cel=sk.reduce((a,x)=>a+x.o.ulohy.length,0);
    h+='<div style="font-size:13px;letter-spacing:1.5px;text-transform:uppercase;color:var(--pink);font-weight:800;margin:18px 0 9px">'
      +p+' <span style="opacity:.6;font-weight:600;letter-spacing:0;text-transform:none">· '+sk.length+' okruhů, '+hot+'/'+cel+' úloh</span></div>';
    sk.forEach(function(x){
      const o=x.o,i=x.i,d=(S.done[o.id]||[]).length,c=o.ulohy.length,pr=Math.round(100*d/c);
      h+='<button class="card" onclick="otevri('+i+')"><b>'+o.ikona+' '+o.nazev+'</b><span>'+o.popis+'</span>'
        +'<div class="bar"><i style="width:'+pr+'%"></i></div>'
        +'<span style="display:block;margin-top:6px;font-size:11.5px">'+d+' z '+c+' úloh hotovo · '+o.vyklad.length+' stran výkladu</span></button>';
    });
  });
  $("okruhy").innerHTML=h;
}
function otevri(i){O=DATA[i];$("rzName").textContent=O.ikona+" "+O.nazev;$("rzPopis").textContent=O.popis;go("rezim");}
function resetProgress(){if(confirm("Opravdu vynulovat všechen postup?")){S={done:{},ok:0,total:0};save();renderMenu();}}

/* ================= VÝKLAD ================= */
function startVyklad(){vi=0;renderVyklad();go("vyklad");}
function vyklad(d){
  if(vi+d>=O.vyklad.length){startUlohy();return;}
  vi=Math.max(0,vi+d);renderVyklad();window.scrollTo(0,0);
}
function renderVyklad(){
  const v=O.vyklad[vi];
  $("vkOkruh").textContent=O.ikona+" "+O.nazev;
  $("vkPoc").textContent="Výklad "+(vi+1)+"/"+O.vyklad.length;
  $("vkH").textContent=v.h;$("vkT").textContent=v.t;
  let e="";
  if(v.svg)e+=v.svg;
  if(v.f)e+='<div class="formula">'+radky(v.f)+"</div>";
  $("vkExtra").innerHTML=e;
  $("vkBack").disabled=vi===0;
  $("vkNext").textContent=vi===O.vyklad.length-1?"Teď to zkus ✏️":"Další →";
  $("vkDots").innerHTML=O.vyklad.map((_,i)=>'<i class="'+(i===vi?"on":"")+'"></i>').join("");
}

/* ================= ÚLOHY ================= */
function startUlohy(){
  const d=S.done[O.id]||[];
  ui=0;while(ui<O.ulohy.length&&d.includes(ui))ui++;
  if(ui>=O.ulohy.length)ui=0;
  renderUloha();go("uloha");
}
function renderUloha(){
  odpovezeno=false;
  const u=O.ulohy[ui];
  $("ulOkruh").textContent=O.ikona+" "+O.nazev;
  $("ulPoc").textContent="Úloha "+(ui+1)+"/"+O.ulohy.length;
  $("ulQ").textContent=u.q;
  $("ulVis").innerHTML=u.svg||"";
  $("ulFb").innerHTML="";$("ulShow").style.display="none";$("ulNext").style.display="none";
  kresliSpeed();
  if(u.typ==="choice"){
    $("ulAns").innerHTML=u.moz.map((m,i)=>'<button class="ans" data-i="'+i+'"><span class="k">'+"ABCD"[i]+'</span>'+m+'</button>').join("");
    document.querySelectorAll("#ulAns .ans").forEach(b=>b.addEventListener("click",()=>volba(+b.dataset.i)));
  }else{
    $("ulAns").innerHTML='<input type="text" id="ulIn" inputmode="text" autocomplete="off" placeholder="sem napiš výsledek">'
      +'<div class="hintline">Stačí samotné číslo, například 6 nebo 30</div>'
      +'<button class="btn" id="ulChk">'+(S.rychly?"Zkontrolovat a pokračovat ⏩":"Zkontrolovat")+'</button>';
    $("ulChk").addEventListener("click",kontrola);
    $("ulIn").addEventListener("keydown",e=>{if(e.key==="Enter")kontrola()});
  }
}
function norm(s){return String(s).toLowerCase().trim().replace(/\s+/g,"").replace(/,/g,".").replace(/^x=/,"").replace(/(cm|minut|min)$/,"");}
function zapis(spravne){
  if(odpovezeno)return;odpovezeno=true;
  const d=S.done[O.id]||(S.done[O.id]=[]);
  if(!d.includes(ui)){d.push(ui);S.total++;if(spravne)S.ok++;}
  save();
}
function volba(i){
  if(odpovezeno)return;
  const u=O.ulohy[ui],bs=document.querySelectorAll("#ulAns .ans");
  bs[u.spr].classList.add("ok");
  if(i!==u.spr)bs[i].classList.add("bad");
  hotovo(i===u.spr);
}
function kontrola(){
  if(odpovezeno)return;
  const u=O.ulohy[ui],v=$("ulIn").value;
  if(!v.trim()){$("ulIn").focus();return;}
  hotovo(norm(v)===norm(u.odp));
}
function hotovo(spravne){
  zapis(spravne);
  // rychlý režim: správná odpověď = rovnou dál, tabule se nezdržuje
  if(spravne&&S.rychly){
    $("ulFb").innerHTML='<div class="fb ok">✅ Správně — jedeme dál</div>';
    setTimeout(()=>{if(document.getElementById("s-uloha").classList.contains("on"))dalsiUloha();},620);
    return;
  }
  $("ulFb").innerHTML='<div class="fb '+(spravne?"ok":"no")+'">'
    +(spravne?"✅ Správně! Přesně tak.":"🤔 Tentokrát ne. Nevadí — pojď se podívat, jak na to.")+"</div>";
  $("ulShow").style.display="block";
  $("ulShow").textContent=spravne?"🧑‍🏫 Ukaž postup na tabuli":"🧑‍🏫 Vysvětli mi to na tabuli";
  // chybu si vždycky projdeme, ale i tak nechávám cestu dál
  $("ulNext").style.display="block";
  $("ulNext").textContent=spravne?"Pokračovat na další úlohu →":"Přeskočit a jít dál →";
}
/* ================= TABULE ================= */
function showTabule(){
  const u=O.ulohy[ui];
  $("tbOkruh").textContent=O.ikona+" "+O.nazev;
  $("tbPoc").textContent="Úloha "+(ui+1)+"/"+O.ulohy.length;
  $("tbQ").textContent=u.q;
  $("tbSteps").innerHTML="";$("tbRes").innerHTML="";
  ki=0;$("tbNext").style.display="block";$("tbNext").textContent="Začni psát →";$("tbDone").style.display="none";
  go("tabule");
}
function krok(){
  const u=O.ulohy[ui];
  if(ki<u.kroky.length){
    const k=u.kroky[ki];
    $("tbSteps").insertAdjacentHTML("beforeend",
      '<div class="step"><div class="n">'+k.n+'</div>'
      +(k.d?'<p class="d">'+k.d+"</p>":"")
      +(k.f?'<div class="f">'+radky(k.f)+"</div>":"")+"</div>");
    ki++;
    $("tbNext").textContent=ki<u.kroky.length?"Další krok →":"Ukaž výsledek 🎯";
    window.scrollTo(0,document.body.scrollHeight);
  }else{
    $("tbRes").innerHTML='<div class="result">'+u.vys+"</div>";
    $("tbNext").style.display="none";$("tbDone").style.display="block";
    window.scrollTo(0,document.body.scrollHeight);
  }
}
function dalsiUloha(){
  if(ui+1>=O.ulohy.length){
    alert("🎉 Hotovo! Prošla jsi celý okruh "+O.nazev+". Můžeš si ho dát znovu, nebo zkusit jiný.");
    renderMenu();go("menu");return;
  }
  ui++;renderUloha();go("uloha");
}
renderMenu();
</script>
